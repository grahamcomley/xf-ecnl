# UAT (test) copy of the site. Page changes publish here first; "promote" sends them to the main site.
# Scores update here too, every 15 minutes. The uat.sidelinestandings.com domain is attached in the dashboard.
name               = "xf-ecnl-site-uat"
compatibility_date = "2026-06-01"
account_id         = "f4844cb4fa247cf50ffc158d9ee9d27d"
workers_dev        = true
# The API (/api/*: optional accounts, saved teams). Everything else is the static site.
main               = "../api/worker.js"

# Alerts: check for new scores every 5 minutes and send notifications.
[triggers]
crons = ["*/5 * * * *"]

[assets]
binding = "ASSETS"
run_worker_first = ["/api/*"]
directory = "../site"

