<!DOCTYPE html>
<!-- Shown by the app only if it has never once loaded the site with signal (the site's service worker
     serves the saved copy after that). Bundled inside the app, so it always displays. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sideline Standings</title>
<style>html,body{margin:0;height:100%;background:#0d1015;color:#e8ebf0;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
.w{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 26px;box-sizing:border-box;gap:12px}
h1{font-size:24px;margin:0}p{margin:0;max-width:300px;color:#9aa3ae;font-size:15px;line-height:1.5}
button{margin-top:10px;border:0;border-radius:10px;padding:13px 26px;font-size:16px;font-weight:700;background:#d0102b;color:#fff}</style></head>
<body><div class="w"><h1>Sideline Standings</h1><p>No connection right now. The app needs signal the first time it opens; after that it works from its saved copy.</p>
<button onclick="location.href='https://sidelinestandings.com/'">Try again</button></div></body></html>
