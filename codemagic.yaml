# Sideline Standings iPhone app -> TestFlight (Codemagic, Mac build).
# Copied from Hashmark's proven setup. The app is a native shell (Capacitor, in app/) that loads the
# live site, so page changes reach the app with no build. A build is needed only for:
#   app/capacitor.config.json, app/native/*, app/icon-1024.png, or this file.
#
# NO triggering: block on purpose. A website push must never start a Mac build. Builds start only
# from GitHub: Actions > "Build iPhone app" > Run workflow (.github/workflows/ios-build.yml).
workflows:
  ios-testflight:
    name: Sideline iOS to TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      groups:
        - signing          # holds CERTIFICATE_PRIVATE_KEY (same as Hashmark)
      vars:
        BUNDLE_ID: "com.sidelinestandings.app"
        TEAM_ID: "55FGL4DVG5"
        APP_STORE_APPLE_ID: "0"   # set after the App Store Connect app record exists
    scripts:
      - name: Install JS dependencies
        script: |
          cd app
          npm install --no-audit --no-fund

      - name: Generate the iOS project
        script: |
          set -euo pipefail
          cd app
          # ios/ is not committed: regenerated every build so it can't drift from the config.
          npx cap add ios || true
          npx cap sync ios
          [ -f ios/App/App/public/offline.html ] || { echo "!! offline.html missing from the bundle"; exit 1; }
          echo "plugins:"; grep -o '"pkg": *"[^"]*"' ios/App/App/capacitor.config.json 2>/dev/null || cat ios/App/App/capacitor.config.json | head -40

      - name: App icon
        script: |
          set -euo pipefail
          cd app
          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          [ -d "$ICONSET" ] || { echo "!! $ICONSET missing"; exit 1; }
          # Apple rejects icons with alpha; round-trip through JPEG drops it.
          sips -s format jpeg icon-1024.png --out /tmp/ss-icon.jpg >/dev/null
          sips -s format png /tmp/ss-icon.jpg --out /tmp/ss-icon.png >/dev/null
          for f in "$ICONSET"/*.png; do
            W=$(sips -g pixelWidth "$f" | awk '/pixelWidth/{print $2}'); H=$(sips -g pixelHeight "$f" | awk '/pixelHeight/{print $2}')
            [ -n "$W" ] && [ -n "$H" ] || continue
            sips -s format png -z "$H" "$W" /tmp/ss-icon.png --out "$f" >/dev/null
            echo "  icon -> $(basename "$f") ${W}x${H}"
          done

      - name: Native code (badge plugin, push hooks, push entitlement)
        script: |
          set -euo pipefail
          cd app
          cp native/SidelineApp.swift native/AppViewController.swift ios/App/App/
          cp native/App.entitlements ios/App/App/App.entitlements
          # Push: Capacitor's plugin needs the app delegate to hand it Apple's device token.
          AD=ios/App/App/AppDelegate.swift
          if ! grep -q didRegisterForRemoteNotificationsWithDeviceToken "$AD"; then
            ruby -e '
              f = ARGV[0]; s = File.read(f)
              hooks = <<~SW

                  func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {
                      NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)
                  }

                  func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {
                      NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)
                  }
              SW
              i = s.rindex("}") or abort("no closing brace in AppDelegate")
              s.insert(i, hooks.gsub(/^/, "    ").sub(/\A\s*\n/, "\n"))
              File.write(f, s)
            ' "$AD"
          fi
          grep -n "RemoteNotifications" "$AD" || { echo "!! push hooks not in AppDelegate"; exit 1; }
          ruby -e '
            require "xcodeproj"
            path = "ios/App/App.xcodeproj"
            project = Xcodeproj::Project.open(path)
            target = project.targets.find { |t| t.name == "App" } or abort("No App target")
            group = project.main_group.find_subpath("App", true)
            have = target.source_build_phase.files_references.map { |r| r.path.to_s.split("/").last }
            ["SidelineApp.swift", "AppViewController.swift"].each do |f|
              next puts("already in target: #{f}") if have.include?(f)
              target.add_file_references([group.new_file(f)]); puts "added to target: #{f}"
            end
            group.new_file("App.entitlements") unless group.files.any? { |f| f.path.to_s.end_with?("App.entitlements") }
            target.build_configurations.each { |c| c.build_settings["CODE_SIGN_ENTITLEMENTS"] = "App/App.entitlements" }
            project.save
          '
          SB="ios/App/App/Base.lproj/Main.storyboard"
          sed -i '' 's/customClass="CAPBridgeViewController" customModule="Capacitor"/customClass="AppViewController" customModule="App"/g' "$SB"
          sed -i '' 's/customClass="CAPBridgeViewController"/customClass="AppViewController" customModule="App"/g' "$SB"
          grep -q 'customClass="AppViewController"' "$SB" || { echo "!! storyboard not patched - badge plugin would not register"; exit 1; }

      - name: Patch Info.plist (name, app-bound domains, background push, export compliance)
        script: |
          set -euo pipefail
          cd app
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Sideline" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Sideline" "$PLIST"
          # App-bound domains: lets the site's service worker run inside the app (offline copy, fast
          # start). The app may only navigate to these (max 10); sign-in pages are included.
          /usr/libexec/PlistBuddy -c "Delete :WKAppBoundDomains" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :WKAppBoundDomains array" "$PLIST"
          i=0
          for d in sidelinestandings.com uat.sidelinestandings.com clerk.sidelinestandings.com accounts.google.com google.com gstatic.com googleapis.com googleusercontent.com appleid.apple.com; do
            /usr/libexec/PlistBuddy -c "Add :WKAppBoundDomains:$i string $d" "$PLIST"; i=$((i+1))
          done
          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string remote-notification" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print" "$PLIST" | head -50

      - name: Set the version and build number
        script: |
          set -euo pipefail
          APPV=$(grep -o 'name="app-version" content="v[0-9.]*' site/index.html | sed 's/.*content="v//')
          echo "App version from the page: $APPV"
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "0")
          NEXT=$(($LATEST + 1))
          cd app/ios/App
          agvtool new-marketing-version "$APPV"
          agvtool new-version -all $NEXT
          echo "=== TestFlight will show: $APPV ($NEXT) ==="

      - name: Create + install signing certificate and profile
        script: |
          set -euo pipefail
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE --platform IOS \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY --create
          keychain add-certificates
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" || echo "!! no profiles"
          xcode-project use-profiles --project "app/ios/App/App.xcodeproj"

      - name: Build the signed IPA
        script: |
          set -euo pipefail
          if [ -d "app/ios/App/App.xcworkspace" ]; then
            xcode-project build-ipa --workspace "app/ios/App/App.xcworkspace" --scheme "App" --archive-xcargs "DEVELOPMENT_TEAM=$TEAM_ID"
          else
            xcode-project build-ipa --project "app/ios/App/App.xcodeproj" --scheme "App" --archive-xcargs "DEVELOPMENT_TEAM=$TEAM_ID"
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false   # internal testers get every build with no review (Hashmark lesson)
      # No email block: this repo is public, so no addresses here. Apple emails TestFlight builds,
      # and the GitHub "Build iPhone app" run reports early failures.
