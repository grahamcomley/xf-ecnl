<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>XF ECNL · Standings & Predictions</title>
<style>
:root{--ink:#16181d;--mut:#6b7280;--line:#e5e7eb;--bg:#f6f7f9;--card:#fff;--red:#c8102e;--grn:#15803d;--amb:#b45309;--blu:#1d4ed8}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
header{background:#111;color:#fff;padding:14px 16px 0;position:sticky;top:0;z-index:5}
header h1{margin:0 0 10px;font-size:17px;letter-spacing:.2px}header h1 b{color:#ff4d61}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}.tabs button{flex:none;border:0;background:none;color:#bbb;padding:9px 12px;font:inherit;font-weight:600;border-bottom:3px solid transparent;cursor:pointer}
.tabs button.on{color:#fff;border-color:var(--red)}
main{max-width:980px;margin:0 auto;padding:14px 12px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut)}
.focus{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--bg);border-radius:10px;padding:10px}.stat .v{font-size:24px;font-weight:700}.stat .k{font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}th{font-size:11px;color:var(--mut);text-align:right;font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}td.t,th.t{text-align:left;white-space:normal}
tr.me td{background:#fff1f2;font-weight:600}tr.cut td{border-bottom:2px dashed var(--red)}
.fx{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.fx .when{font-size:12px;color:var(--mut);display:flex;justify-content:space-between;gap:8px}
.fx .teams{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;margin:6px 0}
.fx .teams .a{text-align:right}.fx .score{font-weight:700;font-size:16px;text-align:center;min-width:44px}
.bar{display:flex;height:22px;border-radius:6px;overflow:hidden;font-size:11px;font-weight:600;color:#fff}
.bar div{display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden}
.bh{background:#2f6fde}.bd{background:#9ca3af}.ba{background:#e2552d}
.toggles{display:flex;gap:6px;margin-top:8px}.toggles button{flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 4px;font:inherit;font-size:12px;cursor:pointer}
.toggles button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;background:var(--bg);color:var(--mut);font-weight:600}
.pill.g{background:#dcfce7;color:var(--grn)}.pill.a{background:#fef3c7;color:var(--amb)}.pill.r{background:#fee2e2;color:var(--red)}
.root{font-size:12px;margin-top:6px;color:var(--ink)}.root b{color:var(--grn)}
.mut{color:var(--mut);font-size:12px}.warn{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:10px;font-size:13px;margin-bottom:14px}
.delta{font-size:12px;font-weight:700}.up{color:var(--grn)}.dn{color:var(--red)}
.row2{display:grid;grid-template-columns:1fr;gap:14px}@media(min-width:820px){.row2{grid-template-columns:1fr 1fr}}
.reset{float:right;border:0;background:none;color:var(--blu);font:inherit;font-size:13px;cursor:pointer}
.path{display:grid;grid-template-columns:1fr;gap:8px}.node{border-left:3px solid var(--red);padding:4px 10px}
a{color:var(--blu)}footer{font-size:12px;color:var(--mut);text-align:center;margin-top:20px}
.scroll{overflow-x:auto}
</style>
</head>
<body>
<header><h1><b>XF</b> ECNL · Standings &amp; Predictions</h1><nav class="tabs" id="tabs"></nav></header>
<main id="app"><div class="card">Loading…</div></main>
<script>
"use strict";
const $ = (s, e = document) => e.querySelector(s);
const pct = x => (x >= 0.995 ? ">99" : x < 0.005 ? (x > 0 ? "<1" : "0") : Math.round(x * 100)) + "%";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtDate = d => new Date(d + "T12:00:00").toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric"});
const fmtTime = t => { if (!t || t === "00:00") return "Time TBD"; let [h, m] = t.split(":").map(Number); return `${(h % 12) || 12}:${String(m).padStart(2,"0")} ${h < 12 ? "AM" : "PM"}`; };
const todayISO = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };

// ---------- model ----------
function makeModel(D) {
  const T = new Map(D.teams.map(t => [t.id, t]));
  const mu = D.model ? D.model.mu : 0.3, home = D.model ? D.model.home : 0;
  const lam = (h, a, neutral) => {
    const H = T.get(h), A = T.get(a);
    const ha = H ? H.p[0] : 0, hd = H ? H.p[1] : 0, aa = A ? A.p[0] : 0, ad = A ? A.p[1] : 0;
    return [Math.exp(mu + (neutral ? 0 : home) + ha - ad), Math.exp(mu + aa - hd)];
  };
  const pois = (l, R) => { let L = Math.exp(-l), k = 0, p = 1; do { k++; p *= R(); } while (p > L && k < 15); return k - 1; };
  const pmf = (l, k) => { let p = Math.exp(-l); for (let i = 1; i <= k; i++) p *= l / i; return p; };
  const probs = (h, a, neutral) => {
    const [lh, la] = lam(h, a, neutral); let w = 0, d = 0, l = 0, best = [0, 0], bp = -1;
    for (let i = 0; i <= 10; i++) for (let j = 0; j <= 10; j++) {
      const p = pmf(lh, i) * pmf(la, j); if (i > j) w += p; else if (i === j) d += p; else l += p;
      if (p > bp) { bp = p; best = [i, j]; }
    }
    const s = w + d + l; return {w: w / s, d: d / s, l: l / s, score: best, lh, la};
  };
  const sample = (h, a, neutral, force, R = Math.random) => {
    const [lh, la] = lam(h, a, neutral);
    for (let k = 0; k < 60; k++) {
      const x = pois(lh, R), y = pois(la, R);
      if (!force || (force === "H" && x > y) || (force === "D" && x === y) || (force === "A" && x < y)) return [x, y];
    }
    return force === "H" ? [1, 0] : force === "D" ? [1, 1] : [0, 1];
  };
  return {T, probs, sample};
}

function confidence(D, a, b) {
  const A = D.teams.find(t => t.id === a), B = D.teams.find(t => t.id === b);
  if (!A || !B) return ["Low", "r", "No rating data for one team yet."];
  if (A.conf === B.conf && A.conf !== "other") return ["Good", "g", "Same conference: plenty of shared opponents."];
  const links = Math.min(A.conf_links || 0, B.conf_links || 0);
  if (links >= 20) return ["Good", "g", `Their conferences are linked by ${Math.round(links)}+ cross-conference games.`];
  if (links >= 6) return ["Medium", "a", `Only ~${Math.round(links)} cross-conference games link their conferences.`];
  return ["Low", "r", "Almost no games yet link these two conferences, so this compares records against different opponents. Treat it as a rough guess until national events are played."];
}

// ---------- conference simulation ----------
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function table(rows, games, ids) {
  const t = new Map(ids.map(i => [i, {id: i, gp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0}]));
  const add = (h, a, x, y) => {
    const H = t.get(h), A = t.get(a); if (!H || !A) return;
    H.gp++; A.gp++; H.gf += x; H.ga += y; A.gf += y; A.ga += x;
    if (x > y) { H.w++; H.pts += 3; A.l++; } else if (x === y) { H.d++; A.d++; H.pts++; A.pts++; } else { A.w++; A.pts += 3; H.l++; }
  };
  for (const g of games) add(g.home_id, g.away_id, g.hs, g.as);
  for (const r of rows) add(r[0], r[1], r[2], r[3]);
  const list = [...t.values()];
  for (const r of list) { r.ppg = r.gp ? r.pts / r.gp : 0; r.gd = r.gf - r.ga; }
  return list;
}
function rank(list, games, extra) {
  const h2h = (a, b) => { let p = 0; const all = games.map(g => [g.home_id, g.away_id, g.hs, g.as]).concat(extra || []);
    for (const [h, aw, x, y] of all) { if (h === a && aw === b) p += x > y ? 3 : x === y ? 1 : 0; if (h === b && aw === a) p += y > x ? 3 : x === y ? 1 : 0; } return p; };
  const ptsCount = {}; for (const r of list) ptsCount[r.pts] = (ptsCount[r.pts] || 0) + 1;
  return list.sort((a, b) => (b.ppg - a.ppg) || (b.pts - a.pts) ||
    (ptsCount[a.pts] === 2 ? h2h(b.id, a.id) - h2h(a.id, b.id) : 0) || (b.gd - a.gd) || (b.gf - a.gf) || (a.ga - b.ga));
}

function simulate(D, M, played, remaining, forced, N) {
  const ids = D.teams.map(t => t.id), pos = new Map(ids.map(i => [i, new Array(ids.length).fill(0)]));
  const ppgSum = new Map(ids.map(i => [i, 0]));
  for (let n = 0; n < N; n++) {
    const extra = remaining.map((g, gi) => { const [x, y] = M.sample(g.home_id, g.away_id, false, forced[g.id], rng(n * 7919 + gi * 104729 + 1)); return [g.home_id, g.away_id, x, y]; });
    const r = rank(table(extra, played, ids), played, extra);
    r.forEach((row, i) => { pos.get(row.id)[i]++; ppgSum.set(row.id, ppgSum.get(row.id) + row.ppg); });
  }
  const out = new Map();
  for (const i of ids) { const p = pos.get(i).map(c => c / N); out.set(i, {pos: p, ppg: ppgSum.get(i) / N}); }
  return out;
}

// ---------- rendering ----------
let INDEX, CUR, DATA = {}, FORCED = {};
async function boot() {
  INDEX = await (await fetch("data/index.json", {cache: "no-store"})).json();
  const nav = $("#tabs");
  nav.innerHTML = INDEX.competitions.map(c => `<button data-id="${c.id}">${esc(c.title)}</button>`).join("");
  nav.onclick = e => { const b = e.target.closest("button"); if (b) show(b.dataset.id); };
  window.onhashchange = () => { if (location.hash.slice(1) !== CUR) show(location.hash.slice(1)); };
  show(location.hash.slice(1) || INDEX.competitions[0].id);
}
async function show(id) {
  if (!INDEX.competitions.some(c => c.id === id)) id = INDEX.competitions[0].id;
  CUR = id; location.hash = id;
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.id === id));
  if (!DATA[id]) DATA[id] = await (await fetch(`data/${id}.json`, {cache: "no-store"})).json();
  FORCED[id] = FORCED[id] || {};
  const D = DATA[id];
  (D.comp.kind === "bracket" ? renderBracket : renderConference)(D);
}

function teamName(D, id, fallback) { const t = D.teams.find(x => x.id === id); return t ? t.short : (fallback || "TBD"); }

function fixtureCard(D, M, g, opts = {}) {
  const P = M.probs(g.home_id, g.away_id, opts.neutral);
  const f = FORCED[CUR][g.id] || "";
  const me = D.comp.focus_team, H = teamName(D, g.home_id, g.home), A = teamName(D, g.away_id, g.away);
  const bold = (n, id) => (D.teams.find(t => t.id === id) || {}).name === me ? `<b>${esc(n)}</b>` : esc(n);
  const played = g.hs != null && g.as != null;
  const conf = opts.neutral ? confidence(D, g.home_id, g.away_id) : null;
  return `<div class="fx">
    <div class="when"><span>${fmtDate(g.date)} · ${fmtTime(g.time)}</span><span>${esc(g.venue || "")}</span></div>
    <div class="teams"><div>${bold(H, g.home_id)}</div>
      <div class="score">${played ? `${g.hs}–${g.as}` : `<span class="mut">${P.score[0]}–${P.score[1]}</span>`}</div>
      <div class="a">${bold(A, g.away_id)}</div></div>
    ${played ? "" : `<div class="bar"><div class="bh" style="width:${P.w*100}%">${pct(P.w)}</div><div class="bd" style="width:${P.d*100}%">${pct(P.d)}</div><div class="ba" style="width:${P.l*100}%">${pct(P.l)}</div></div>
    <div class="mut" style="margin-top:4px">Most likely score ${P.score[0]}–${P.score[1]}${conf ? ` · <span class="pill ${conf[1]}" title="${esc(conf[2])}">${conf[0]} confidence</span>` : ""}</div>
    ${opts.toggles ? `<div class="toggles" data-g="${g.id}">
      <button data-f="H" class="${f==="H"?"on":""}">${esc(H)} win</button><button data-f="D" class="${f==="D"?"on":""}">Draw</button><button data-f="A" class="${f==="A"?"on":""}">${esc(A)} win</button></div>` : ""}
    ${opts.root || ""}`}
    ${g.pending ? `<div class="mut" style="margin-top:4px">⚠ Date has passed but no score is posted yet. Treated as still to play.</div>` : ""}
  </div>`;
}

function renderConference(D) {
  const M = makeModel(D), today = todayISO();
  const ids = D.teams.map(t => t.id), focus = D.teams.find(t => t.name === D.comp.focus_team);
  const valid = D.games.filter(g => g.home_id && g.away_id && !g.bad);
  const played = valid.filter(g => g.hs != null && g.as != null);
  const remaining = valid.filter(g => g.hs == null || g.as == null);
  remaining.forEach(g => g.pending = g.date < today);
  const forced = FORCED[CUR];
  for (const k of Object.keys(forced)) if (!remaining.some(g => String(g.id) === k)) delete forced[k];
  const spots = D.comp.playoff_spots;
  const atOrAbove = (S, id, k) => S.get(id).pos.slice(0, k + 1).reduce((a, b) => a + b, 0);

  const base = simulate(D, M, played, remaining, {}, 3000);
  // Which race is still open for the focus team? If the playoff spot is all but
  // settled, the interesting question becomes 1st place (seeding).
  let keyIdx = 0, keyLabel = "1st";
  if (spots && focus) {
    const pTop = atOrAbove(base, focus.id, spots - 1);
    if (pTop > 0.03 && pTop < 0.97) { keyIdx = spots - 1; keyLabel = `Top ${spots}`; }
  }
  const cur = Object.keys(forced).length ? simulate(D, M, played, remaining, forced, 3000) : base;

  // upcoming: next game weekend (first remaining date + 2 days)
  const future = remaining.filter(g => g.date >= today).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  const start = future[0] ? future[0].date : null;
  const endD = start ? new Date(new Date(start + "T12:00:00").getTime() + 2.5 * 864e5).toISOString().slice(0, 10) : null;
  const weekend = future.filter(g => g.date <= endD);
  const pending = remaining.filter(g => g.pending);

  // leverage: how much each upcoming result moves the focus team's key probability
  let lev = [];
  if (focus) {
    const cand = remaining.filter(g => !forced[g.id]).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 14);
    for (const g of cand) {
      const res = {};
      for (const o of ["H", "D", "A"]) {
        const S = simulate(D, M, played, remaining, {...forced, [g.id]: o}, 1500);
        res[o] = {key: atOrAbove(S, focus.id, keyIdx), first: atOrAbove(S, focus.id, 0)};
      }
      const P = M.probs(g.home_id, g.away_id);
      const vals = ["H", "D", "A"].map(o => res[o].key);
      const best = ["H", "D", "A"][vals.indexOf(Math.max(...vals))];
      const firstVals = ["H", "D", "A"].map(o => res[o].first);
      const swing = Math.max(...vals) - Math.min(...vals) + 0.5 * (Math.max(...firstVals) - Math.min(...firstVals));
      lev.push({g, res, best, swing, P});
    }
    lev.sort((a, b) => b.swing - a.swing);
  }
  const levOf = id => lev.find(x => x.g.id === id);
  const rootLine = g => {
    const L = levOf(g.id); if (!L || !focus || L.swing < 0.03) return "";
    const involves = g.home_id === focus.id || g.away_id === focus.id;
    const who = L.best === "H" ? teamName(D, g.home_id) : L.best === "A" ? teamName(D, g.away_id) : "a draw";
    const k = L.res[L.best].key, lo = Math.min(L.res.H.key, L.res.D.key, L.res.A.key);
    return `<div class="root">${involves ? "Stakes" : "Root for"}: <b>${esc(who)}</b> · ${esc(focus.short)} ${keyLabel} chance ${pct(lo)} → ${pct(k)} depending on result</div>`;
  };

  // official vs computed check
  let mismatch = [];
  for (const o of D.official) {
    const c = D.computed.find(x => x.id === o.id); if (!c) continue;
    if (o.gp !== c.gp || o.pts !== c.pts) mismatch.push(`${teamName(D, o.id)}: ECNL shows ${o.gp} GP / ${o.pts} pts, scores add up to ${c.gp} GP / ${c.pts} pts`);
  }

  const now = rank(table([], played, ids), played);
  const fS = focus ? cur.get(focus.id) : null, fB = focus ? base.get(focus.id) : null;
  const delta = (a, b) => { const d = Math.round((a - b) * 100); return d ? `<span class="delta ${d > 0 ? "up" : "dn"}">${d > 0 ? "+" : ""}${d}</span>` : ""; };
  const nForced = Object.keys(forced).length;
  const fPos = focus ? now.findIndex(r => r.id === focus.id) + 1 : null;

  const projected = [...ids].sort((a, b) => cur.get(b).ppg - cur.get(a).ppg);
  const rangeOf = id => { const p = cur.get(id).pos; let c = 0, lo = null, hi = null; p.forEach((x, i) => { c += x; if (lo === null && c >= 0.1) lo = i + 1; if (hi === null && c >= 0.9) hi = i + 1; }); return lo === hi ? `${lo}` : `${lo}–${hi}`; };

  $("#app").innerHTML = `
  ${nForced ? `<div class="warn">What-if mode: ${nForced} result${nForced>1?"s":""} set by you. Numbers show the change. <button class="reset" id="reset">Clear what-ifs</button></div>` : ""}
  ${focus ? `<div class="card"><h2>${esc(focus.short)}</h2><div class="focus">
     <div class="stat"><div class="v">${fPos}${["st","nd","rd"][fPos-1]||"th"}</div><div class="k">Current place (by PPG)</div></div>
     <div class="stat"><div class="v">${pct(atOrAbove(cur, focus.id, 0))} ${nForced ? delta(atOrAbove(cur, focus.id, 0), atOrAbove(base, focus.id, 0)) : ""}</div><div class="k">Chance to finish 1st</div></div>
     ${spots ? `<div class="stat"><div class="v">${pct(atOrAbove(cur, focus.id, spots - 1))} ${nForced ? delta(atOrAbove(cur, focus.id, spots - 1), atOrAbove(base, focus.id, spots - 1)) : ""}</div><div class="k">${esc(D.comp.playoff_label || keyLabel)}</div></div>` : ""}
     <div class="stat"><div class="v">${fS.ppg.toFixed(2)}</div><div class="k">Projected final PPG · finish ${rangeOf(focus.id)}</div></div>
   </div></div>` : ""}
  ${mismatch.length ? `<div class="warn">⚠ ECNL's table doesn't match the posted scores: ${mismatch.map(esc).join("; ")}. Our table uses the scores.</div>` : ""}
  ${pending.length ? `<div class="warn">Awaiting scores: ${pending.map(g => `${esc(teamName(D,g.home_id))} v ${esc(teamName(D,g.away_id))} (${fmtDate(g.date)})`).join(", ")}</div>` : ""}
  <div class="row2">
    <div class="card"><h2>Next up · ${start ? fmtDate(start) : "no games scheduled"}</h2>
      <div class="mut" style="margin-bottom:8px">Tap a result to see how it changes everything.</div>
      ${weekend.map(g => fixtureCard(D, M, g, {toggles: true, root: rootLine(g)})).join("") || "<div class='mut'>Nothing scheduled.</div>"}
    </div>
    <div class="card"><h2>Games that matter most to ${focus ? esc(focus.short) : "you"}</h2>
      <div class="mut" style="margin-bottom:8px">Ranked by how much each result swings ${focus ? esc(focus.short) : ""}'s chance of finishing ${keyLabel === "1st" ? "1st" : keyLabel.toLowerCase()}${keyLabel === "1st" && spots ? ` (the top-${spots} spot is ${pct(atOrAbove(base, focus.id, spots - 1))} likely already, so the race that matters is 1st)` : ""}.</div>
      ${lev.filter(x => !weekend.includes(x.g)).slice(0, 5).map(x => fixtureCard(D, M, x.g, {toggles: true, root: rootLine(x.g)})).join("") || "<div class='mut'>—</div>"}
    </div>
  </div>
  <div class="card scroll"><h2>Standings now</h2><table>
    <tr><th>#</th><th class="t">Team</th><th>GP</th><th>W-D-L</th><th>GD</th><th>PTS</th><th>PPG</th></tr>
    ${now.map((r, i) => `<tr class="${focus && r.id === focus.id ? "me" : ""} ${spots && i === spots - 1 ? "cut" : ""}"><td>${i+1}</td><td class="t">${esc(teamName(D, r.id))}</td><td>${r.gp}</td><td>${r.w}-${r.d}-${r.l}</td><td>${r.gd > 0 ? "+" : ""}${r.gd}</td><td>${r.pts}</td><td>${r.ppg.toFixed(2)}</td></tr>`).join("")}
  </table>${spots ? `<div class="mut" style="margin-top:6px">Dashed line = ${esc(D.comp.playoff_label)}. Ranked by points per game.</div>` : ""}</div>
  <div class="card scroll"><h2>Projected finish${nForced ? " (with your what-ifs)" : ""}</h2><table>
    <tr><th class="t">Team</th><th>Rating</th><th>Proj PPG</th><th>Likely place</th><th>1st</th>${spots ? `<th>Top ${spots}</th>` : ""}</tr>
    ${projected.map(id => { const t = D.teams.find(x => x.id === id); const S = cur.get(id), B = base.get(id);
      return `<tr class="${focus && id === focus.id ? "me" : ""}"><td class="t">${esc(t.short)}</td><td>${t.strength > 0 ? "+" : ""}${t.strength.toFixed(2)}</td><td>${S.ppg.toFixed(2)}</td><td>${rangeOf(id)}</td>
      <td>${pct(S.pos[0])} ${nForced ? delta(S.pos[0], B.pos[0]) : ""}</td>${spots ? `<td>${pct(atOrAbove(cur, id, spots - 1))} ${nForced ? delta(atOrAbove(cur, id, spots - 1), atOrAbove(base, id, spots - 1)) : ""}</td>` : ""}</tr>`; }).join("")}
  </table><div class="mut" style="margin-top:6px">Rating = expected goal difference against an average ${esc(D.pool.name.includes("boys") ? "ECNL U16" : "")} team. Based on ${D.pool.games_rated} games across ${D.pool.teams_rated} teams, simulated 3,000 times.</div></div>
  <div class="card"><h2>All remaining games</h2>${remaining.filter(g => !weekend.includes(g)).sort((a,b)=>a.date.localeCompare(b.date)).map(g => fixtureCard(D, M, g, {toggles: true})).join("")}</div>
  <div class="card"><h2>Results</h2>${played.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(g => fixtureCard(D, M, g)).join("")}</div>
  ${footer(D)}`;
  bindToggles();
}

function footer(D) {
  const bt = D.pool.backtest;
  return `<footer>Updated ${new Date(D.updated).toLocaleString()} · Data: <a href="${esc(D.comp.ecnl_link)}" target="_blank" rel="noopener">official ECNL schedule</a>
  ${bt ? `<br>Model check: replaying this season's ${bt.games} games using only earlier results, it picked the right outcome ${Math.round(bt.accuracy*100)}% of the time (score ${bt.logloss} vs ${bt.baseline_logloss} for a no-information guess; lower is better).` : ""}
  <br>Unofficial. Predictions are estimates, not guarantees.</footer>`;
}

function bindToggles() {
  document.querySelectorAll(".toggles").forEach(el => el.onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    const id = el.dataset.g, f = b.dataset.f, F = FORCED[CUR];
    if (F[id] === f) delete F[id]; else F[id] = f;
    const y = window.scrollY; show(CUR).then(() => window.scrollTo(0, y));
  });
  const r = $("#reset"); if (r) r.onclick = () => { FORCED[CUR] = {}; show(CUR); };
}

// ---------- bracket ----------
function renderBracket(D) {
  const M = makeModel(D), focus = D.teams.find(t => t.name === D.comp.focus_team);
  const games = D.games.slice().sort((a, b) => (a.num || 0) - (b.num || 0));
  const byNum = new Map(games.map(g => [g.num, g]));
  const ref = s => { const m = /^(Winner|Loser)\s+(?:of\s+)?Game\s+#?(\d+)/i.exec(s || ""); return m ? [m[1].toLowerCase(), +m[2]] : null; };
  // A game is on the winners' path if every team in it got there only by winning.
  const winPath = new Map();
  const isWin = g => { if (!g) return false; if (winPath.has(g.num)) return winPath.get(g.num);
    const rh = ref(g.home), ra = ref(g.away); let v;
    if (!rh && !ra) v = true; else if (!rh || !ra) v = false;
    else v = rh[0] === "winner" && ra[0] === "winner" && isWin(byNum.get(rh[1])) && isWin(byNum.get(ra[1]));
    winPath.set(g.num, v); return v; };
  const depth = g => { const rh = ref(g.home); return rh ? 1 + depth(byNum.get(rh[1]) || {}) : 0; };
  const wp = games.filter(g => isWin(g) && ref(g.home));
  const champ = wp.length ? wp.reduce((a, b) => depth(b) > depth(a) ? b : a) : games[games.length - 1];
  const stage = g => !ref(g.home) ? "Opening game" : g === champ ? "Championship" : isWin(g) ? "Winners' side" : "Consolation";
  const N = 20000, appear = new Map(), oppCount = new Map(), wins = new Map();
  for (const g of games) { appear.set(g.num, new Map()); oppCount.set(g.num, new Map()); }
  for (let n = 0; n < N; n++) {
    const res = new Map();
    const resolve = (g, side) => {
      const id = g[side + "_id"]; if (id) return id;
      const r = ref(g[side]); if (!r) return null;
      const out = play(byNum.get(r[1])); return out ? (r[0] === "winner" ? out[0] : out[1]) : null;
    };
    const play = g => {
      if (!g) return null; if (res.has(g.num)) return res.get(g.num);
      const h = resolve(g, "home"), a = resolve(g, "away"); if (!h || !a) { res.set(g.num, null); return null; }
      let hw;
      if (g.hs != null && g.as != null) hw = g.hs > g.as || (g.hs === g.as && (g.hpk ?? 0) > (g.apk ?? 0));
      else { const [x, y] = M.sample(h, a, true); hw = x > y || (x === y && Math.random() < 0.5); }
      const out = hw ? [h, a] : [a, h]; res.set(g.num, out);
      for (const t of [h, a]) { const m = appear.get(g.num); m.set(t, (m.get(t) || 0) + 1); }
      const key = `${h}|${a}`; const oc = oppCount.get(g.num); oc.set(key, (oc.get(key) || 0) + 1);
      return out;
    };
    for (const g of games) play(g);
    const r = res.get(champ.num); if (r) wins.set(r[0], (wins.get(r[0]) || 0) + 1);
  }
  const prob = (num, id) => (appear.get(num).get(id) || 0) / N;
  const tn = id => teamName(D, id);
  const card = t => { const r = t.conf_record; return `<tr class="${focus && t.id === focus.id ? "me" : ""}"><td class="t">${esc(t.short)}<div class="mut">${esc((t.conf_name || "").replace(/ 20\d\d-\d\d$/, ""))}</div></td>
    <td>${r ? `${r.w}-${r.d}-${r.l}` : "—"}</td><td>${r ? (r.gd > 0 ? "+" : "") + r.gd : "—"}</td><td>${t.strength > 0 ? "+" : ""}${t.strength.toFixed(2)}</td><td>${t.pool_rank ? "#" + t.pool_rank : "—"}</td><td>${pct((wins.get(t.id) || 0) / N)}</td></tr>`; };
  const fGames = focus ? games.filter(g => prob(g.num, focus.id) > 0).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time) || a.num - b.num) : [];
  const path = fGames.map(g => {
    const p = prob(g.num, focus.id);
    const vs = new Map();
    for (const [k, c] of oppCount.get(g.num).entries()) { const [h, a] = k.split("|").map(Number); if (h === focus.id) vs.set(a, (vs.get(a) || 0) + c); else if (a === focus.id) vs.set(h, (vs.get(h) || 0) + c); }
    const lines = [...vs.entries()].sort((a, b) => b[1] - a[1]).map(([o, c]) => {
      const P = M.probs(focus.id, o, true); const cf = confidence(D, focus.id, o);
      return `<div style="margin:4px 0">vs <b>${esc(tn(o))}</b> <span class="mut">(${pct(c / N / p)} of the time)</span> · win ${pct(P.w)} · draw ${pct(P.d)} · lose ${pct(P.l)} <span class="pill ${cf[1]}" title="${esc(cf[2])}">${cf[0]}</span></div>`; }).join("");
    const label = stage(g);
    return `<div class="node"><div><b>Game ${g.num}</b> · ${fmtDate(g.date)} ${fmtTime(g.time)} · ${label} <span class="mut">· ${esc(focus.short)} plays here ${pct(p)}</span></div>${lines}</div>`;
  }).join("");
  const first = games.filter(g => g.home_id && g.away_id);
  const anyLow = focus && first.some(g => (g.home_id === focus.id || g.away_id === focus.id) && confidence(D, g.home_id, g.away_id)[0] === "Low");
  $("#app").innerHTML = `
    ${anyLow ? `<div class="warn">These teams come from different conferences with few games linking them yet, so cross-conference odds are rough. They sharpen as soon as Phoenix results come in, and every game played here feeds the ratings.</div>` : ""}
    ${focus ? `<div class="card"><h2>${esc(focus.short)}'s possible path</h2><div class="mut" style="margin-bottom:8px">Each later game depends on earlier results. A win sends you to the winners' side, a loss to the losers' side. Draws in bracket games assumed to go to penalties (50/50).</div><div class="path">${path}</div>
       <div class="mut" style="margin-top:8px">Chance ${esc(focus.short)} wins the group: <b>${pct((wins.get(focus.id) || 0) / N)}</b></div></div>` : ""}
    <div class="card"><h2>Opening games</h2>${first.map(g => fixtureCard(D, M, g, {neutral: true})).join("")}</div>
    <div class="card scroll"><h2>The group</h2><table><tr><th class="t">Team</th><th>Conf W-D-L</th><th>GD</th><th>Rating</th><th>Rank</th><th>Win group</th></tr>
      ${D.teams.slice().sort((a, b) => b.strength - a.strength).map(card).join("")}</table>
      <div class="mut" style="margin-top:6px">Rank = position among all ${D.pool.teams_rated} rated U16 teams in our data.</div></div>
    <div class="card"><h2>All bracket games</h2>${games.map(g => `<div class="fx"><div class="when"><span>Game ${g.num} · ${fmtDate(g.date)} · ${fmtTime(g.time)}</span><span>${esc(g.venue)}</span></div>
      <div class="teams"><div>${esc(g.home_id ? tn(g.home_id) : g.home)}</div><div class="score">${g.hs != null ? `${g.hs}–${g.as}` : "v"}</div><div class="a">${esc(g.away_id ? tn(g.away_id) : g.away)}</div></div></div>`).join("")}</div>
    ${footer(D)}`;
}

boot().catch(e => { $("#app").innerHTML = `<div class="card">Couldn't load data: ${esc(e.message)}</div>`; });
</script>
</body>
</html>
