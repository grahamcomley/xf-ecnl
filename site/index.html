<body>
<header><h1><b>XF</b> ECNL · Standings &amp; Predictions</h1><nav class="tabs" id="tabs"></nav></header>
<main id="app"><div class="card">Loading…</div></main>
<script>
"use strict";
const $ = (s, e = document) => e.querySelector(s);
const pct = x => (x >= 0.995 ? ">99" : x < 0.005 ? (x > 0 ? "<1" : "0") : Math.round(x * 100)) + "%";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtDate = d => new Date(d + "T12:00:00").toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric"});
const fmtTime = t => { if (!t || t === "00:00") return "Time TBD"; let [h, m] = t.split(":").map(Number); return `${(h % 12) || 12}:${String(m).padStart(2,"0")} ${h < 12 ? "AM" : "PM"}`; };
const todayISO = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };

// ---------- model ----------
const DRAW_GAP = 0.03;
function makeModel(D) {
  const T = new Map(D.teams.map(t => [t.id, t]));
  const mu = D.model ? D.model.mu : 0.3, home = D.model ? D.model.home : 0;
  const lam = (h, a, neutral) => {
    const H = T.get(h), A = T.get(a);
    const ha = H ? H.p[0] : 0, hd = H ? H.p[1] : 0, aa = A ? A.p[0] : 0, ad = A ? A.p[1] : 0;
    return [Math.exp(mu + (neutral ? 0 : home) + ha - ad), Math.exp(mu + aa - hd)];
  };
  const pois = (l, R) => { let L = Math.exp(-l), k = 0, p = 1; do { k++; p *= R(); } while (p > L && k < 15); return k - 1; };
  const pmf = (l, k) => { let p = Math.exp(-l); for (let i = 1; i <= k; i++) p *= l / i; return p; };
  const probs = (h, a, neutral) => {
    const [lh, la] = lam(h, a, neutral); let w = 0, d = 0, l = 0;
    const best = [[1, 0, -1], [0, 0, -1], [0, 1, -1]];  // likeliest score within each result
    for (let i = 0; i <= 10; i++) for (let j = 0; j <= 10; j++) {
      const p = pmf(lh, i) * pmf(la, j), o = i > j ? 0 : i === j ? 1 : 2;
      if (o === 0) w += p; else if (o === 1) d += p; else l += p;
      if (p > best[o][2]) best[o] = [i, j, p];
    }
    const s = w + d + l, top = [w, d, l].indexOf(Math.max(w, d, l));
    // Our pick: the more likely winner, unless it's a true toss-up (within DRAW_GAP), then a draw.
    // Tested on 1,760 past games: calling draws more often only lowers accuracy.
    const pick = Math.abs(w - l) / s < DRAW_GAP ? "D" : (w > l ? "H" : "A");
    const scores = {H: best[0].slice(0, 2), D: best[1].slice(0, 2), A: best[2].slice(0, 2)};
    return {w: w / s, d: d / s, l: l / s, score: best[top].slice(0, 2), scores, pick, lh, la};
  };
  const sample = (h, a, neutral, force, R = Math.random) => {
    const [lh, la] = lam(h, a, neutral);
    for (let k = 0; k < 60; k++) {
      const x = pois(lh, R), y = pois(la, R);
      if (!force || (force === "H" && x > y) || (force === "D" && x === y) || (force === "A" && x < y)) return [x, y];
    }
    return force === "H" ? [1, 0] : force === "D" ? [1, 1] : [0, 1];
  };
  return {T, probs, sample};
}

function confidence(D, a, b) {
  const A = D.teams.find(t => t.id === a), B = D.teams.find(t => t.id === b);
  if (!A || !B) return ["Low", "r", "No rating data for one team yet."];
  if (A.conf === B.conf && A.conf !== "other") return ["Good", "g", "Same conference: plenty of shared opponents."];
  const links = Math.min(A.conf_links || 0, B.conf_links || 0);
  if (links >= 20) return ["Good", "g", `Their conferences are linked by ${Math.round(links)}+ cross-conference games.`];
  if (links >= 6) return ["Medium", "a", `Only ~${Math.round(links)} cross-conference games link their conferences.`];
  return ["Low", "r", "Almost no games yet link these two conferences, so this compares records against different opponents. Treat it as a rough guess until national events are played."];
}

// ---------- conference simulation ----------
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function table(rows, games, ids) {
  const t = new Map(ids.map(i => [i, {id: i, gp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0}]));
  const add = (h, a, x, y) => {
    const H = t.get(h), A = t.get(a); if (!H || !A) return;
    H.gp++; A.gp++; H.gf += x; H.ga += y; A.gf += y; A.ga += x;
    if (x > y) { H.w++; H.pts += 3; A.l++; } else if (x === y) { H.d++; A.d++; H.pts++; A.pts++; } else { A.w++; A.pts += 3; H.l++; }
  };
  for (const g of games) add(g.home_id, g.away_id, g.hs, g.as);
  for (const r of rows) add(r[0], r[1], r[2], r[3]);
  const list = [...t.values()];
  for (const r of list) { r.ppg = r.gp ? r.pts / r.gp : 0; r.gd = r.gf - r.ga; }
  return list;
}
function rank(list, games, extra) {
  const h2h = (a, b) => { let p = 0; const all = games.map(g => [g.home_id, g.away_id, g.hs, g.as]).concat(extra || []);
    for (const [h, aw, x, y] of all) { if (h === a && aw === b) p += x > y ? 3 : x === y ? 1 : 0; if (h === b && aw === a) p += y > x ? 3 : x === y ? 1 : 0; } return p; };
  const ptsCount = {}; for (const r of list) ptsCount[r.pts] = (ptsCount[r.pts] || 0) + 1;
  return list.sort((a, b) => (b.ppg - a.ppg) || (b.pts - a.pts) ||
    (ptsCount[a.pts] === 2 ? h2h(b.id, a.id) - h2h(a.id, b.id) : 0) || (b.gd - a.gd) || (b.gf - a.gf) || (a.ga - b.ga));
}

function simulate(D, M, played, remaining, forced, N) {
  // Plays out every remaining game N times. Each (simulation, game) pair has its own
  // seeded random stream, so changing one pick doesn't reshuffle every other game.
  const ids = D.teams.map(t => t.id), nT = ids.length;
  const pos = new Map(ids.map(i => [i, new Array(nT).fill(0)]));
  const sums = new Map(ids.map(i => [i, {gp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0, ppg: 0}]));
  for (let n = 0; n < N; n++) {
    const extra = remaining.map((g, gi) => { const [x, y] = M.sample(g.home_id, g.away_id, false, forced[g.id], rng(n * 7919 + gi * 104729 + 1)); return [g.home_id, g.away_id, x, y]; });
    const r = rank(table(extra, played, ids), played, extra);
    r.forEach((row, i) => { pos.get(row.id)[i]++; const s = sums.get(row.id); for (const k in s) s[k] += row[k]; });
  }
  const out = new Map();
  for (const i of ids) { const s = sums.get(i), avg = {}; for (const k in s) avg[k] = s[k] / N; out.set(i, {pos: pos.get(i).map(c => c / N), ...avg}); }
  return out;
}
const atOrAbove = (S, id, k) => S.get(id).pos.slice(0, k + 1).reduce((a, b) => a + b, 0);

// ---------- rendering ----------
let INDEX, CUR, DATA = {}, PICKS = {}, CTX = null;
const store = {get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
               set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }};
async function boot() {
  INDEX = await (await fetch("data/index.json", {cache: "no-store"})).json();
  const nav = $("#tabs");
  nav.innerHTML = INDEX.competitions.map(c => `<button data-id="${c.id}">${esc(c.title)}</button>`).join("");
  nav.onclick = e => { const b = e.target.closest("button"); if (b) show(b.dataset.id); };
  window.onhashchange = () => { if (location.hash.slice(1) !== CUR) show(location.hash.slice(1)); };
  show(location.hash.slice(1) || INDEX.competitions[0].id);
}
async function show(id) {
  if (!INDEX.competitions.some(c => c.id === id)) id = INDEX.competitions[0].id;
  CUR = id; location.hash = id;
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.id === id));
  if (!DATA[id]) DATA[id] = await (await fetch(`data/${id}.json`, {cache: "no-store"})).json();
  PICKS[id] = PICKS[id] || {};
  const D = DATA[id];
  (D.comp.kind === "bracket" ? renderBracket : renderConference)(D);
  bindSections();
}

function teamName(D, id, fallback) { const t = D.teams.find(x => x.id === id); return t ? t.short : (fallback || "TBD"); }

function fixtureCard(D, M, g, opts = {}) {
  const me = D.comp.focus_team, H = teamName(D, g.home_id, g.home), A = teamName(D, g.away_id, g.away);
  const bold = (n, id) => (D.teams.find(t => t.id === id) || {}).name === me ? `<b>${esc(n)}</b>` : esc(n);
  const played = g.hs != null && g.as != null;
  const cls = "fx" + (opts.matters ? " matters" : "");
  if (played) return `<div class="${cls}">
    <div class="when"><span>${fmtDate(g.date)} · Final</span><span>${esc(g.venue || "")}</span></div>
    <div class="teams"><div>${bold(H, g.home_id)}</div><div class="score final">${g.hs}–${g.as}</div><div class="a">${bold(A, g.away_id)}</div></div></div>`;
  const P = M.probs(g.home_id, g.away_id, opts.neutral);
  const conf = opts.neutral ? confidence(D, g.home_id, g.away_id) : null;
  const f = opts.picks ? (PICKS[CUR][g.id] || "") : "";
  const btn = (k, label) => `<button data-f="${k}" class="${P.pick === k ? "ours" : ""} ${f === k ? "on" : ""}">${label}</button>`;
  return `<div class="${cls}">
    <div class="when"><span>${fmtDate(g.date)} · ${fmtTime(g.time)}</span><span>${opts.matters ? `<span class="pill tag">Matters to us</span> ` : ""}${esc(g.venue || "")}</span></div>
    <div class="teams"><div>${bold(H, g.home_id)}</div><div class="score vs">vs</div><div class="a">${bold(A, g.away_id)}</div></div>
    <div class="bar"><div class="bh" style="width:${P.w*100}%">${pct(P.w)}</div><div class="bd" style="width:${P.d*100}%">${pct(P.d)}</div><div class="ba" style="width:${P.l*100}%">${pct(P.l)}</div></div>
    <div class="mut" style="margin-top:4px">Most likely: <b>${esc(H)} ${P.score[0]}–${P.score[1]} ${esc(A)}</b>${conf ? ` · <span class="pill ${conf[1]}" title="${esc(conf[2])}">${conf[0]} confidence</span>` : ""}</div>
    ${opts.picks ? `<div class="toggles" data-g="${g.id}">
      ${btn("H", esc(H) + " win")}${btn("D", "Draw")}${btn("A", esc(A) + " win")}</div>` : ""}
    ${opts.root ? `<div class="root" data-root="${g.id}">${opts.root}</div>` : ""}
    ${g.pending ? `<div class="mut" style="margin-top:4px">⚠ Date has passed but no score is posted yet. Treated as still to play.</div>` : ""}
  </div>`;
}

// Collapsible section; open/closed state remembered per tab on this device.
function sec(kind, chip, title, sub, body, key) {
  const k = `open:${CUR}:${key || title}`, saved = store.get(k);
  const open = saved === null ? true : saved === "1";
  return `<details class="card sec sec-${kind}" data-key="${esc(k)}" ${open ? "open" : ""}>
    <summary class="sec-head"><span class="chip chip-${kind}">${chip}</span><h2>${title}</h2><span class="caret">▾</span></summary>
    <div class="sec-body">${sub ? `<div class="mut sec-sub">${sub}</div>` : ""}${body}</div></details>`;
}
function bindSections() {
  document.querySelectorAll("details.sec").forEach(d => d.addEventListener("toggle", () => store.set(d.dataset.key, d.open ? "1" : "0")));
}
function resultRow(D, g, focus) {
  const H = teamName(D, g.home_id, g.home), A = teamName(D, g.away_id, g.away);
  let tag = "";
  if (focus) { const us = g.home_id === focus.id ? g.hs : g.as, them = g.home_id === focus.id ? g.as : g.hs;
    tag = `<span class="res res-${us > them ? "w" : us === them ? "d" : "l"}">${us > them ? "W" : us === them ? "D" : "L"}</span>`; }
  return `<div class="rrow">${tag}<span class="rd">${fmtDate(g.date)}</span><span class="rt">${esc(H)} <b>${g.hs}–${g.as}</b> ${esc(A)}</span></div>`;
}
const addDays = (iso, n) => new Date(new Date(iso + "T12:00:00").getTime() + n * 864e5).toISOString().slice(0, 10);
const signed = d => (d > 0 ? "+" : d < 0 ? "−" : "±") + Math.abs(d);
const ord = n => n + (["th","st","nd","rd"][(n % 100 - 20) % 10] || ["th","st","nd","rd"][n % 100] || "th");

function renderConference(D) {
  const M = makeModel(D), today = todayISO();
  const ids = D.teams.map(t => t.id), focus = D.teams.find(t => t.name === D.comp.focus_team);
  const valid = D.games.filter(g => g.home_id && g.away_id && !g.bad);
  const played = valid.filter(g => g.hs != null && g.as != null);
  const remaining = valid.filter(g => g.hs == null || g.as == null);
  remaining.forEach(g => g.pending = g.date < today);
  const picks = PICKS[CUR];
  for (const k of Object.keys(picks)) if (!remaining.some(g => String(g.id) === k)) delete picks[k];
  const spots = D.comp.playoff_spots;
  const N = 4000;
  const base = simulate(D, M, played, remaining, {}, N);

  // Which race is still open for us? If the playoff spot is all but settled, 1st place is the race.
  let keyIdx = 0, keyLabel = "finishing 1st";
  if (spots && focus) { const p = atOrAbove(base, focus.id, spots - 1); if (p > 0.03 && p < 0.97) { keyIdx = spots - 1; keyLabel = `making the top ${spots}`; } }
  const keyNow = focus ? atOrAbove(base, focus.id, keyIdx) : 0;

  const isMe = g => focus && (g.home_id === focus.id || g.away_id === focus.id);
  const upcoming = remaining.slice().sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  const nextOurs = upcoming.filter(g => isMe(g) && (g.pending || g.date >= today)).slice(0, 3);
  const week = upcoming.filter(g => !isMe(g) && ((g.date >= today && g.date <= addDays(today, 7)) || g.pending));
  const ourResults = played.filter(isMe).sort((a, b) => b.date.localeCompare(a.date));
  const divResults = played.filter(g => !isMe(g)).sort((a, b) => b.date.localeCompare(a.date));
  const now = rank(table([], played, ids), played);
  const fPos = focus ? now.findIndex(r => r.id === focus.id) + 1 : null;
  const me = focus ? esc(focus.short) : "Your team";
  const rangeOf = (S, id) => { const p = S.get(id).pos; let c = 0, lo = null, hi = null; p.forEach((x, i) => { c += x; if (lo === null && c >= 0.1) lo = i + 1; if (hi === null && c >= 0.9) hi = i + 1; }); return lo === hi ? `${lo}` : `${lo}–${hi}`; };
  let mismatch = [];
  for (const o of D.official) { const c = D.computed.find(x => x.id === o.id); if (c && (o.gp !== c.gp || o.pts !== c.pts)) mismatch.push(`${teamName(D, o.id)}: ECNL shows ${o.gp} GP / ${o.pts} pts, scores add up to ${c.gp} GP / ${c.pts} pts`); }
  const BAD = "Calculating…";

  $("#app").innerHTML = `
  <div class="ctx"><div class="ctx-team">${me}</div>
    <div class="ctx-sub">${esc(D.comp.age_label || "")} · ${esc(D.comp.context || "")} · ${ids.length} teams${spots ? ` · ${esc(D.comp.playoff_label)}` : ""}</div></div>
  ${mismatch.length ? `<div class="warn">⚠ ECNL's table doesn't match the posted scores: ${mismatch.map(esc).join("; ")}. Our table uses the scores.</div>` : ""}

  ${sec("us", me, "1 · Where we stand", "Official results only. This section never changes when you make predictions.", `
    ${focus ? `<div class="focus" style="margin-bottom:12px">
      <div class="stat"><div class="v">${ord(fPos)}</div><div class="k">Place now</div></div>
      <div class="stat"><div class="v">${pct(atOrAbove(base, focus.id, 0))}</div><div class="k">Chance to finish 1st</div></div>
      ${spots ? `<div class="stat"><div class="v">${pct(atOrAbove(base, focus.id, spots - 1))}</div><div class="k">Chance of top ${spots} (playoffs)</div></div>` : ""}
      <div class="stat"><div class="v">${rangeOf(base, focus.id)}</div><div class="k">Most likely final place</div></div>
    </div>` : ""}
    <div class="scroll"><table class="grid">
    <tr><th>#</th><th class="t">Team</th><th>GP</th><th>W-D-L</th><th>GD</th><th>PTS</th><th>PPG</th></tr>
    ${now.map((r, i) => `<tr class="${focus && r.id === focus.id ? "me" : ""} ${spots && i === spots - 1 ? "cut" : ""}"><td>${i+1}</td><td class="t">${esc(teamName(D, r.id))}</td><td>${r.gp}</td><td>${r.w}-${r.d}-${r.l}</td><td>${r.gd > 0 ? "+" : ""}${r.gd}</td><td>${r.pts}</td><td>${r.ppg.toFixed(2)}</td></tr>`).join("")}
    </table></div>${spots ? `<div class="mut" style="margin-top:6px">Ranked by points per game. Dashed line = playoff cut (${esc(D.comp.playoff_label)}).</div>` : ""}`, "s1")}

  ${sec("us", me, `2 · Our next ${nextOurs.length || ""} games`, focus ? `Win/draw/loss odds for each game, and what each result does to ${me}'s chance of ${keyLabel} (now <b>${pct(keyNow)}</b>).` : "",
    nextOurs.map(g => fixtureCard(D, M, g, {root: BAD})).join("") || "<div class='mut'>No more games scheduled.</div>", "s2")}

  ${sec("div", "League", "3 · Rest of the league · next 7 days", `Every other league game from ${fmtDate(today)} to ${fmtDate(addDays(today, 7))}. Gray cards matter to ${me}.`,
    week.map(g => fixtureCard(D, M, g, {root: BAD})).join("") || "<div class='mut'>No other league games in the next 7 days.</div>", "s3")}

  ${sec("div", "Predict", "4 · Rest-of-season predictor", `Every remaining game played out ${N.toLocaleString()} times. Pick results below to see how the final table changes. Only this section changes.`, `
    <div class="picksbar" id="picksbar"></div>
    <div class="scroll" id="predtable"></div>
    <h3 style="margin-top:14px">Remaining games (${upcoming.length}) · gray = our pick, tap to change</h3>
    <div id="predgames">${upcoming.map(g => fixtureCard(D, M, g, {picks: true})).join("")}</div>`, "s4")}

  ${sec("past", "Past", "5 · Past games", "Final scores.", `
    <h3>${me}</h3>${ourResults.map(g => resultRow(D, g, focus)).join("") || "<div class='mut'>None yet.</div>"}
    <details class="inner"><summary>Rest of the league (${divResults.length} games)</summary>${divResults.map(g => resultRow(D, g, null)).join("")}</details>`, "s5")}
  ${footer(D)}`;

  CTX = {D, M, played, remaining, base, focus, spots, N, keyIdx, ids};
  drawPredictor();
  $("#predgames").addEventListener("click", onPick);

  // Fill in the "what each result does" lines after the page is visible.
  if (focus) setTimeout(() => {
    const need = [...nextOurs, ...week];
    const nowK = atOrAbove(simulate(D, M, played, remaining, {}, 1500), focus.id, keyIdx);
    for (const g of need) {
      const res = {};
      for (const o of ["H", "D", "A"]) res[o] = atOrAbove(simulate(D, M, played, remaining, {[g.id]: o}, 1500), focus.id, keyIdx);
      const el = document.querySelector(`[data-root="${g.id}"]`); if (!el) continue;
      const dl = o => Math.round((res[o] - nowK) * 100);
      if (isMe(g)) {
        const usH = g.home_id === focus.id, W = usH ? "H" : "A", L = usH ? "A" : "H";
        el.innerHTML = `Chance of ${keyLabel} (now ${pct(keyNow)}): <b class="up">win ${signed(dl(W))}</b> · draw ${signed(dl("D"))} · <span class="dn">loss ${signed(dl(L))}</span>`;
      } else {
        const swing = Math.max(res.H, res.D, res.A) - Math.min(res.H, res.D, res.A);
        const best = ["H", "D", "A"].reduce((a, b) => res[b] > res[a] ? b : a);
        const who = best === "H" ? teamName(D, g.home_id) : best === "A" ? teamName(D, g.away_id) : "a draw";
        if (swing >= 0.04) {
          el.closest(".fx").classList.add("matters");
          const head = el.closest(".fx").querySelector(".when span:last-child");
          if (head && !head.querySelector(".tag")) head.insertAdjacentHTML("afterbegin", `<span class="pill tag">Matters to us</span> `);
          const lab = o => o === "H" ? `${esc(teamName(D, g.home_id))} win` : o === "A" ? `${esc(teamName(D, g.away_id))} win` : "draw";
          el.innerHTML = `Root for <b>${esc(who)}</b>. ${me}'s chance of ${keyLabel} (now ${pct(nowK)}): ` +
            ["H", "D", "A"].map(o => o === best ? `<b class="up">${lab(o)} → ${pct(res[o])}</b>` : `${lab(o)} → ${pct(res[o])}`).join(" · ");
        } else el.remove();
      }
    }
  }, 30);
}

function drawPredictor() {
  const {D, M, played, remaining, base, focus, spots, N, ids} = CTX;
  const picks = PICKS[CUR], nP = Object.keys(picks).length;
  const S = nP ? simulate(D, M, played, remaining, picks, N) : base;
  // "If every pick comes true": your overrides, otherwise our pick, each with its likeliest score.
  const rows = remaining.map(g => { const P = M.probs(g.home_id, g.away_id); const k = picks[g.id] || P.pick; const sc = P.scores[k]; return [g.home_id, g.away_id, sc[0], sc[1]]; });
  const final = rank(table(rows, played, ids), played, rows);
  const delta = (a, b) => { const d = Math.round((a - b) * 100); return d ? ` <span class="delta ${d > 0 ? "up" : "dn"}">${d > 0 ? "+" : ""}${d}</span>` : ""; };
  const rangeOf = id => { const p = S.get(id).pos; let c = 0, lo = null, hi = null; p.forEach((x, i) => { c += x; if (lo === null && c >= 0.1) lo = i + 1; if (hi === null && c >= 0.9) hi = i + 1; }); return lo === hi ? `${lo}` : `${lo}–${hi}`; };
  $("#picksbar").innerHTML = nP
    ? `<b>You've changed ${nP} pick${nP > 1 ? "s" : ""}</b> (black). Gray = our pick. <button class="reset" id="clearpicks">Reset to our picks</button>`
    : `<span>Showing <b>our pick</b> for every game (gray). Tap a different result to override it (black).</span>`;
  $("#predtable").innerHTML = `<table class="grid">
    <tr><th class="stk">#</th><th class="t stk2">Team</th><th>GP</th><th>W-D-L</th><th>GD</th><th>PTS</th><th>PPG</th><th class="chance">Likely place</th><th class="chance">1st</th>${spots ? `<th class="chance">Top ${spots}</th>` : ""}</tr>
    ${final.map((r, i) => { const id = r.id, s = S.get(id), b = base.get(id);
      return `<tr class="${focus && id === focus.id ? "me" : ""} ${spots && i === spots - 1 ? "cut" : ""}"><td class="stk">${i + 1}</td><td class="t stk2">${esc(teamName(D, id))}</td><td>${r.gp}</td>
      <td>${r.w}-${r.d}-${r.l}</td><td>${r.gd > 0 ? "+" : ""}${r.gd}</td><td>${r.pts}</td><td>${r.ppg.toFixed(2)}</td><td class="chance">${rangeOf(id)}</td>
      <td class="chance">${pct(s.pos[0])}${nP ? delta(s.pos[0], b.pos[0]) : ""}</td>${spots ? `<td class="chance">${pct(atOrAbove(S, id, spots - 1))}${nP ? delta(atOrAbove(S, id, spots - 1), atOrAbove(base, id, spots - 1)) : ""}</td>` : ""}</tr>`; }).join("")}
  </table><div class="mut" style="margin-top:6px"><b>Left columns:</b> final table if every pick comes true. <b>Shaded columns:</b> real chances from playing out the rest of the season ${N.toLocaleString()} times${nP ? " with your changes locked in; green/red = change" : ""}.</div>`;
  const c = $("#clearpicks");
  if (c) c.onclick = () => { PICKS[CUR] = {}; document.querySelectorAll("#predgames .toggles button.on").forEach(b => b.classList.remove("on")); drawPredictor(); };
}

function onPick(e) {
  const b = e.target.closest(".toggles button"); if (!b) return;
  const wrap = b.parentElement, id = wrap.dataset.g, f = b.dataset.f, P = PICKS[CUR];
  if (P[id] === f || b.classList.contains("ours")) { delete P[id]; wrap.querySelectorAll("button").forEach(x => x.classList.remove("on")); }
  else { P[id] = f; wrap.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); }
  $("#predtable").style.opacity = .55;
  setTimeout(() => { drawPredictor(); $("#predtable").style.opacity = 1; }, 10);
}

function footer(D) {
  const bt = D.pool.backtest;
  const B = bt && bt.buckets ? bt.buckets : {};
  const row = (k, label) => B[k] ? `<tr><td class="t">${label}</td><td>${B[k].games}</td><td>${Math.round(B[k].won * 100)}%</td><td>${Math.round(B[k].not_lose * 100)}%</td></tr>` : "";
  const LR = D.live_record;
  const live = LR && LR.games ? `<h3 style="margin-top:12px">Live record on this page's games</h3>
    <div>Our pick was right in <b>${LR.correct} of ${LR.games}</b> games (${Math.round(LR.correct / LR.games * 100)}%); the favorite didn't lose in ${LR.not_lost}.</div>
    ${LR.recent.map(e => `<div class="rrow"><span class="res res-${e.result === e.pick ? "w" : "l"}">${e.result === e.pick ? "✓" : "✗"}</span><span class="rd">${fmtDate(e.date)}</span><span class="rt">${esc(e.home)} <b>${e.score}</b> ${esc(e.away)} <span class="mut">· we picked ${e.pick === "H" ? "home win" : e.pick === "A" ? "away win" : "draw"}</span></span></div>`).join("")}` :
    `<div class="mut" style="margin-top:10px">Live record: starting now. Each game's pick is saved before it's played and scored after.</div>`;
  return `${bt ? sec("past", "Model", "How accurate is this?", `We replayed ${bt.games.toLocaleString()} real games, predicting each one using only results from before it was played.`, `
    <div class="scroll"><table><tr><th class="t">When the favorite was given…</th><th>Games</th><th>Favorite won</th><th>Didn't lose</th></tr>
    ${row("70+", "70% or more")}${row("60-69", "60–69%")}${row("50-59", "50–59%")}${row("<50", "under 50% (close games)")}</table></div>
    <div class="mut" style="margin-top:6px">Overall it picks the exact result (win/draw/loss) ${Math.round(bt.accuracy * 100)}% of the time, and the favorite avoids losing ${Math.round((bt.fav_not_lose || 0) * 100)}% of the time. About 1 in 5 games end in a draw, which is why exact-result accuracy tops out around 60% even for professional models.</div>${live}`, "acc") : ""}
  <footer>Updated ${new Date(D.updated).toLocaleString()} · Data: <a href="${esc(D.comp.ecnl_link)}" target="_blank" rel="noopener">official ECNL schedule</a><br>Unofficial. Predictions are estimates, not guarantees.</footer>`;
}

// ---------- bracket ----------
function renderBracket(D) {
  const M = makeModel(D), focus = D.teams.find(t => t.name === D.comp.focus_team);
  const games = D.games.slice().sort((a, b) => (a.num || 0) - (b.num || 0));
  const byNum = new Map(games.map(g => [g.num, g]));
  const ref = s => { const m = /^(Winner|Loser)\s+(?:of\s+)?Game\s+#?(\d+)/i.exec(s || ""); return m ? [m[1].toLowerCase(), +m[2]] : null; };
  // A game is on the winners' path if every team in it got there only by winning.
  const winPath = new Map();
  const isWin = g => { if (!g) return false; if (winPath.has(g.num)) return winPath.get(g.num);
    const rh = ref(g.home), ra = ref(g.away); let v;
    if (!rh && !ra) v = true; else if (!rh || !ra) v = false;
    else v = rh[0] === "winner" && ra[0] === "winner" && isWin(byNum.get(rh[1])) && isWin(byNum.get(ra[1]));
    winPath.set(g.num, v); return v; };
  const depth = g => { const rh = ref(g.home); return rh ? 1 + depth(byNum.get(rh[1]) || {}) : 0; };
  const wp = games.filter(g => isWin(g) && ref(g.home));
  const champ = wp.length ? wp.reduce((a, b) => depth(b) > depth(a) ? b : a) : games[games.length - 1];
  const stage = g => !ref(g.home) ? "Opening game" : g === champ ? "Championship" : isWin(g) ? "Winners' side" : "Consolation";
  const N = 20000, appear = new Map(), oppCount = new Map(), wins = new Map();
  for (const g of games) { appear.set(g.num, new Map()); oppCount.set(g.num, new Map()); }
  for (let n = 0; n < N; n++) {
    const res = new Map();
    const resolve = (g, side) => {
      const id = g[side + "_id"]; if (id) return id;
      const r = ref(g[side]); if (!r) return null;
      const out = play(byNum.get(r[1])); return out ? (r[0] === "winner" ? out[0] : out[1]) : null;
    };
    const play = g => {
      if (!g) return null; if (res.has(g.num)) return res.get(g.num);
      const h = resolve(g, "home"), a = resolve(g, "away"); if (!h || !a) { res.set(g.num, null); return null; }
      let hw;
      if (g.hs != null && g.as != null) hw = g.hs > g.as || (g.hs === g.as && (g.hpk ?? 0) > (g.apk ?? 0));
      else { const [x, y] = M.sample(h, a, true); hw = x > y || (x === y && Math.random() < 0.5); }
      const out = hw ? [h, a] : [a, h]; res.set(g.num, out);
      for (const t of [h, a]) { const m = appear.get(g.num); m.set(t, (m.get(t) || 0) + 1); }
      const key = `${h}|${a}`; const oc = oppCount.get(g.num); oc.set(key, (oc.get(key) || 0) + 1);
      return out;
    };
    for (const g of games) play(g);
    const r = res.get(champ.num); if (r) wins.set(r[0], (wins.get(r[0]) || 0) + 1);
  }
  const prob = (num, id) => (appear.get(num).get(id) || 0) / N;
  const tn = id => teamName(D, id);
  const card = t => { const r = t.conf_record; return `<tr class="${focus && t.id === focus.id ? "me" : ""}"><td class="t">${esc(t.short)}<div class="mut">${esc((t.conf_name || "").replace(/ 20\d\d-\d\d$/, ""))}</div></td>
    <td>${r ? `${r.w}-${r.d}-${r.l}` : "—"}</td><td>${r ? (r.gd > 0 ? "+" : "") + r.gd : "—"}</td><td>${t.strength > 0 ? "+" : ""}${t.strength.toFixed(2)}</td><td>${t.pool_rank ? "#" + t.pool_rank : "—"}</td><td>${t.games_new ?? "—"} <span class="mut">/ ${t.games_rated}</span></td><td>${pct((wins.get(t.id) || 0) / N)}</td></tr>`; };
  const fGames = focus ? games.filter(g => prob(g.num, focus.id) > 0).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time) || a.num - b.num) : [];
  const path = fGames.map(g => {
    const p = prob(g.num, focus.id);
    const vs = new Map();
    for (const [k, c] of oppCount.get(g.num).entries()) { const [h, a] = k.split("|").map(Number); if (h === focus.id) vs.set(a, (vs.get(a) || 0) + c); else if (a === focus.id) vs.set(h, (vs.get(h) || 0) + c); }
    const lines = [...vs.entries()].sort((a, b) => b[1] - a[1]).map(([o, c]) => {
      const P = M.probs(focus.id, o, true); const cf = confidence(D, focus.id, o);
      return `<div style="margin:4px 0">vs <b>${esc(tn(o))}</b> <span class="mut">(${pct(c / N / p)} of the time)</span> · win ${pct(P.w)} · draw ${pct(P.d)} · lose ${pct(P.l)} <span class="pill ${cf[1]}" title="${esc(cf[2])}">${cf[0]}</span></div>`; }).join("");
    const label = stage(g);
    return `<div class="node"><div><b>Game ${g.num}</b> · ${fmtDate(g.date)} ${fmtTime(g.time)} · ${label} <span class="mut">· ${esc(focus.short)} plays here ${pct(p)}</span></div>${lines}</div>`;
  }).join("");
  const first = games.filter(g => g.home_id && g.away_id);
  const anyLow = focus && first.some(g => (g.home_id === focus.id || g.away_id === focus.id) && confidence(D, g.home_id, g.away_id)[0] === "Low");
  const isMe = g => focus && (g.home_id === focus.id || g.away_id === focus.id);
  const me = focus ? esc(focus.short) : "Your team";
  const ourFirst = first.filter(g => isMe(g) && g.hs == null);
  const othersFirst = first.filter(g => !isMe(g) && g.hs == null);
  const done = games.filter(g => g.hs != null && g.as != null);
  $("#app").innerHTML = `
    <div class="ctx"><div class="ctx-team">${me}</div>
      <div class="ctx-sub">${esc(D.comp.age_label || "")} · ${esc(D.comp.context || "")} · knockout bracket, 3 games each · <b>does not count toward conference standings</b></div></div>
    ${anyLow ? `<div class="warn">These teams come from different conferences with few games linking them yet, so cross-conference odds are rough. They sharpen as Phoenix results come in.</div>` : ""}
    ${ourFirst.length ? sec("us", me, "1 · Our first game", "Neutral field, so no home advantage.", ourFirst.map(g => fixtureCard(D, M, g, {neutral: true})).join("")) : ""}
    ${focus ? sec("us", me, `${ourFirst.length ? 2 : 1} · Our possible path`, `A win sends ${me} to the winners' side, a loss to the consolation side. Tied bracket games assumed to go to penalties (50/50). Chance ${me} wins the group: <b>${pct((wins.get(focus.id) || 0) / N)}</b>.`, `<div class="path">${path}</div>`) : ""}
    ${sec("div", "Group", "Other opening games", "These decide who we could meet on day 2.", othersFirst.map(g => fixtureCard(D, M, g, {neutral: true})).join("") || "<div class='mut'>All played.</div>")}
    ${sec("div", "Group", "The 8 teams", `Conf W-D-L = this season in their own conference. Rank = among all ${D.pool.teams_rated} rated U16 teams. Games = results the rating is built on: new-age-group games since August / all games including last season's 2011 team (counted lightly). Fewer new games = less certain.`, `
      <div class="scroll"><table><tr><th class="t">Team</th><th>Conf W-D-L</th><th>GD</th><th>Rating</th><th>Rank</th><th>Games<br><span class="mut">new / all</span></th><th>Win group</th></tr>
      ${D.teams.slice().sort((a, b) => b.strength - a.strength).map(card).join("")}</table></div>`)}
    ${sec("past", "Schedule", done.length ? "Bracket results & schedule" : "Full bracket schedule", "", games.map(g => `<div class="rrow"><span class="rd">G${g.num} · ${fmtDate(g.date)}<br>${fmtTime(g.time)}</span><span class="rt">${esc(g.home_id ? tn(g.home_id) : g.home)} <b>${g.hs != null ? `${g.hs}–${g.as}` : "v"}</b> ${esc(g.away_id ? tn(g.away_id) : g.away)}</span></div>`).join(""))}
    ${footer(D)}`;
}

boot().catch(e => { $("#app").innerHTML = `<div class="card">Couldn't load data: ${esc(e.message)}</div>`; });
</script>
</body>
</html>
