<body>
<header>
  <div class="brand"><h1>ECNL <b>Standings</b> &amp; Predictions</h1><button class="findbtn" id="findtop" aria-label="Find a team">🔍 Find</button></div>
  <nav class="pills" id="pills"></nav>
  <div class="checked" id="checked"></div>
</header>
<main id="app"><div class="card ctx">Loading…</div></main>
<div id="finder">
  <div class="f-head"><input id="fq" type="search" placeholder="Search any team, club or conference" autocomplete="off"><button class="icon-btn" id="fclose">Close</button></div>
  <div class="f-body" id="fbody"></div>
</div>
<div class="toast" id="toast"></div>
<script>
"use strict";
const $ = (s, e = document) => e.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = x => (x >= 0.995 ? ">99" : x < 0.005 ? (x > 0 ? "<1" : "0") : Math.round(x * 100)) + "%";
const fmtDate = d => new Date(d + "T12:00:00").toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric"});
const fmtTime = t => { if (!t || t === "00:00") return "Time TBD"; let [h, m] = t.split(":").map(Number); return `${(h % 12) || 12}:${String(m).padStart(2,"0")} ${h < 12 ? "AM" : "PM"}`; };
const todayISO = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const addDays = (iso, n) => new Date(new Date(iso + "T12:00:00").getTime() + n * 864e5).toISOString().slice(0, 10);
const signed = d => (d > 0 ? "+" : d < 0 ? "−" : "±") + Math.abs(d);
const ord = n => n + (["th","st","nd","rd"][(n % 100 - 20) % 10] || ["th","st","nd","rd"][n % 100] || "th");
const store = {get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
               set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }};
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 2200); }

// ---------- model ----------
const DRAW_GAP = 0.03;   // tested on 1,760 past games: calling more draws only lowers accuracy
function makeModel(teams, model) {
  const T = new Map(teams.map(t => [t.id, t]));
  const mu = model ? model.mu : 0.3, home = model ? model.home : 0;
  const lam = (h, a, neutral) => {
    const H = T.get(h), A = T.get(a);
    const ha = H ? H.p[0] : 0, hd = H ? H.p[1] : 0, aa = A ? A.p[0] : 0, ad = A ? A.p[1] : 0;
    return [Math.exp(mu + (neutral ? 0 : home) + ha - ad), Math.exp(mu + aa - hd)];
  };
  const pois = (l, R) => { let L = Math.exp(-l), k = 0, p = 1; do { k++; p *= R(); } while (p > L && k < 15); return k - 1; };
  const pmf = (l, k) => { let p = Math.exp(-l); for (let i = 1; i <= k; i++) p *= l / i; return p; };
  const cache = new Map();
  const probs = (h, a, neutral) => {
    const key = `${h}|${a}|${neutral ? 1 : 0}`; if (cache.has(key)) return cache.get(key);
    const [lh, la] = lam(h, a, neutral); let w = 0, d = 0, l = 0;
    const best = [[1, 0, -1], [0, 0, -1], [0, 1, -1]];
    for (let i = 0; i <= 10; i++) for (let j = 0; j <= 10; j++) {
      const p = pmf(lh, i) * pmf(la, j), o = i > j ? 0 : i === j ? 1 : 2;
      if (o === 0) w += p; else if (o === 1) d += p; else l += p;
      if (p > best[o][2]) best[o] = [i, j, p];
    }
    const s = w + d + l, top = [w, d, l].indexOf(Math.max(w, d, l));
    const pick = Math.abs(w - l) / s < DRAW_GAP ? "D" : (w > l ? "H" : "A");
    const r = {w: w / s, d: d / s, l: l / s, score: best[top].slice(0, 2), scores: {H: best[0].slice(0, 2), D: best[1].slice(0, 2), A: best[2].slice(0, 2)}, pick};
    cache.set(key, r); return r;
  };
  const sample = (h, a, neutral, force, R = Math.random) => {
    const [lh, la] = lam(h, a, neutral);
    for (let k = 0; k < 60; k++) {
      const x = pois(lh, R), y = pois(la, R);
      if (!force || (force === "H" && x > y) || (force === "D" && x === y) || (force === "A" && x < y)) return [x, y];
    }
    return force === "H" ? [1, 0] : force === "D" ? [1, 1] : [0, 1];
  };
  return {T, probs, sample};
}
function confidence(teams, a, b) {
  const A = teams.find(t => t.id === a), B = teams.find(t => t.id === b);
  if (!A || !B) return ["Low", "r", "No rating data for one team yet."];
  if (A.conf === B.conf && A.conf !== "other") return ["Good", "g", "Same conference: plenty of shared opponents."];
  const links = Math.min(A.conf_links || 0, B.conf_links || 0);
  if (links >= 20) return ["Good", "g", `Their conferences are linked by ${Math.round(links)}+ cross-conference games.`];
  if (links >= 6) return ["Medium", "a", `Only ~${Math.round(links)} cross-conference games link their conferences.`];
  return ["Low", "r", "Few games link these conferences yet; treat as a rough guess."];
}
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function table(rows, games, ids) {
  const t = new Map(ids.map(i => [i, {id: i, gp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0}]));
  const add = (h, a, x, y) => { const H = t.get(h), A = t.get(a); if (!H || !A) return;
    H.gp++; A.gp++; H.gf += x; H.ga += y; A.gf += y; A.ga += x;
    if (x > y) { H.w++; H.pts += 3; A.l++; } else if (x === y) { H.d++; A.d++; H.pts++; A.pts++; } else { A.w++; A.pts += 3; H.l++; } };
  for (const g of games) add(g.home_id, g.away_id, g.hs, g.as);
  for (const r of rows) add(r[0], r[1], r[2], r[3]);
  const list = [...t.values()]; for (const r of list) { r.ppg = r.gp ? r.pts / r.gp : 0; r.gd = r.gf - r.ga; }
  return list;
}
function rank(list, games, extra) {
  const all = games.map(g => [g.home_id, g.away_id, g.hs, g.as]).concat(extra || []);
  const h2h = (a, b) => { let p = 0; for (const [h, aw, x, y] of all) { if (h === a && aw === b) p += x > y ? 3 : x === y ? 1 : 0; if (h === b && aw === a) p += y > x ? 3 : x === y ? 1 : 0; } return p; };
  const cnt = {}; for (const r of list) cnt[r.pts] = (cnt[r.pts] || 0) + 1;
  return list.sort((a, b) => (b.ppg - a.ppg) || (b.pts - a.pts) || (cnt[a.pts] === 2 ? h2h(b.id, a.id) - h2h(a.id, b.id) : 0) || (b.gd - a.gd) || (b.gf - a.gf) || (a.ga - b.ga));
}
function simulate(ids, M, played, remaining, forced, N) {
  const pos = new Map(ids.map(i => [i, new Array(ids.length).fill(0)]));
  for (let n = 0; n < N; n++) {
    const extra = remaining.map((g, gi) => { const [x, y] = M.sample(g.home_id, g.away_id, false, forced[g.id], rng(n * 7919 + gi * 104729 + 1)); return [g.home_id, g.away_id, x, y]; });
    rank(table(extra, played, ids), played, extra).forEach((row, i) => pos.get(row.id)[i]++);
  }
  const out = new Map(); for (const i of ids) out.set(i, {pos: pos.get(i).map(c => c / N)}); return out;
}
const atOrAbove = (S, id, k) => S.get(id).pos.slice(0, k + 1).reduce((a, b) => a + b, 0);
const rangeOf = (S, id) => { const p = S.get(id).pos; let c = 0, lo = null, hi = null; p.forEach((x, i) => { c += x; if (lo === null && c >= 0.1) lo = i + 1; if (hi === null && c >= 0.9) hi = i + 1; }); return [lo, hi]; };
const placeTxt = r => r[0] === r[1] ? ord(r[0]) : `${ord(r[0])}–${ord(r[1])}`;

// ---------- state: teams index, favorites, routing ----------
let TEAMS = [], INDEX = {}, STATUS = null, CUR = null, CTX = null;
const CONF_CACHE = {}, PICKS = {};
const favs = () => { try { return JSON.parse(store.get("xfFavs") || "null"); } catch (e) { return null; } };
const setFavs = a => { store.set("xfFavs", JSON.stringify(a)); drawPills(); };
const teamByKey = k => TEAMS.find(t => t.k === k);
const shortLabel = t => `${t.s} · ${t.a.split(" ")[0]}${t.a.includes("Girls") ? "G" : "B"}${/RL/.test(t.l) ? " RL" : /^Pre/.test(t.l) ? " Pre" : ""}`;

async function boot() {
  const [teams, index] = await Promise.all([
    fetch("data/teams.json", {cache: "no-store"}).then(r => r.json()),
    fetch("data/index.json", {cache: "no-store"}).then(r => r.json())]);
  TEAMS = teams; INDEX = index;
  fetch("data/status.json", {cache: "no-store"}).then(r => r.ok ? r.json() : null).then(s => { STATUS = s; const el = $("#checked"); if (el && s) el.innerHTML = checkedTxt(); }).catch(() => {});
  window.addEventListener("hashchange", route);
  $("#fclose").onclick = closeFinder;
  $("#findtop").onclick = openFinder;
  $("#fq").addEventListener("input", drawFinder);
  route();
}
function route() {
  let h = location.hash.slice(1);
  if (INDEX.legacy && INDEX.legacy[h]) { h = "t=" + INDEX.legacy[h]; history.replaceState(null, "", "#" + h); }
  const keys = (new URLSearchParams(h).get("t") || "").split(",").filter(k => teamByKey(k));
  let f = favs();
  if (keys.length) {
    if (f === null) { f = keys.slice(); setFavs(f); }     // first visit from a shared link: that team becomes the favorite
    openTeam(keys[0]);
  } else if (f && f.length) {
    openTeam(f[0]);
  } else {
    drawPills(); openFinder();
    $("#app").innerHTML = `<div class="card ctx"><div class="ctx-team">Find your team</div><div class="ctx-sub">Search or browse every ECNL and ECNL RL team we rate, then tap ★ to keep it at the top.</div></div>`;
  }
}
function drawPills() {
  const f = favs() || [];
  $("#pills").innerHTML = f.filter(teamByKey).map(k => `<button class="pill-btn ${k === CUR ? "on" : ""}" data-k="${k}">${esc(shortLabel(teamByKey(k)))}</button>`).join("")
    ;
  $("#pills").onclick = e => { const b = e.target.closest("button"); if (b) location.hash = "t=" + b.dataset.k; };
}
function toggleFav(k) {
  let f = favs() || [];
  if (f.includes(k)) f = f.filter(x => x !== k); else f.push(k);

    const ws = w.length ? w : s.split(/\s+/);

    const out = [];
    if (ws.length >= 3) out.push(up(ws[0][0] + ws[1][0] + ws[2][0]));
    if (ws.length === 2) out.push(up(ws[0][0] + ws[1].slice(0, 2)));
    out.push(up(ws[0].slice(0, 3)));
    if (ws.length >= 2) out.push(up(ws[0].slice(0, 2) + ws[1][0]), up(ws[0][0] + ws[1][0] + (ws[1][1] || "")));
    out.push(up(ws[0].slice(0, 4)));
    return out;
  };

  for (const [id, c] of C) if (first[c[0]] === 1) { map.set(id, c[0]); used.add(c[0]); }
  for (const [id, c] of C) if (!map.has(id)) {

  }

}

    } else {
      const swing = Math.max(res.H, res.D, res.A) - Math.min(res.H, res.D, res.A);
      const lab = o => o === "H" ? `${esc(teamName(D, g.home_id))} win` : o === "A" ? `${esc(teamName(D, g.away_id))} win` : "draw";
      if (swing < 0.02) html = `Barely affects ${me}: chance of ${keyLabel} stays about ${pct(nowK)}.`;
      else {
        const best = ["H", "D", "A"].reduce((a, b) => res[b] > res[a] ? b : a);
        matters = swing >= 0.04;
        html = `Root for <b class="up">${best === "D" ? "a draw" : esc(teamName(D, best === "H" ? g.home_id : g.away_id))}</b>. ${me}'s chance of ${keyLabel} (now ${pct(nowK)}): ` + ["H", "D", "A"].map(o => o === best ? `<b>${lab(o)} → ${pct(res[o])}</b>` : `${lab(o)} → ${pct(res[o])}`).join(" · ");
      }
    }
    document.querySelectorAll(`[data-root="${gid}"]`).forEach(el => {
      el.innerHTML = html;
      if (!matters) return;
      const card = el.closest(".fx"); card.classList.add("matters");
      const head = card.querySelector(".when span:last-child"); if (head && !head.querySelector(".tag")) head.insertAdjacentHTML("afterbegin", `<span class="pill tag">Matters to us</span> `);
    });
  };
  $("#app").onclick = e => {
    const b = e.target.closest(".imp");
    if (b) {
      impact(b.dataset.imp);
      const r = b.closest(".fx").querySelector(`[data-root="${b.dataset.imp}"]`);
      r.hidden = !r.hidden; b.classList.toggle("open", !r.hidden);
      return;
    }
    if (e.target.id === "morebtn") {
      const l = $("#later"); l.hidden = !l.hidden;
      e.target.textContent = l.hidden ? `＋ Show rest of season (${laterOurs.length})` : "－ Hide rest of season";
    }
  };
  setTimeout(() => {
    const vis = [...document.querySelectorAll("[data-root]")].filter(e => !e.closest("#later")).map(e => e.dataset.root);
    for (const gid of new Set(vis)) impact(gid);
  }, 30);
}

function drawPredictor() {
  const {D, M, played, remaining, base, fid, spots, N, ids} = CTX;
  const picks = PICKS[D.__fk], nP = Object.keys(picks).length;
  const S = nP ? simulate(ids, M, played, remaining, picks, N) : base;
  const rows = remaining.map(g => { const P = M.probs(g.home_id, g.away_id); const sc = P.scores[picks[g.id] || P.pick]; return [g.home_id, g.away_id, sc[0], sc[1]]; });
  const fin = rank(table(rows, played, ids), played, rows);
  const delta = (a, b) => { const d = Math.round((a - b) * 100); return d ? ` <span class="delta ${d > 0 ? "up" : "dn"}">${d > 0 ? "+" : ""}${d}</span>` : ""; };
  $("#picksbar").innerHTML = nP ? `<b>You've changed ${nP} pick${nP > 1 ? "s" : ""}.</b> <button class="reset" id="clearpicks">Reset to our picks</button>` : `Showing <b>our pick</b> for every game. Open the list below to change any of them.`;
  $("#predtable").innerHTML = `<table class="grid"><tr><th>#</th><th class="t">Team</th><th>W-D-L</th><th>GD</th><th>PTS</th><th class="chance">1st</th>${spots ? `<th class="chance">Top ${spots}</th>` : ""}</tr>
    ${fin.map((r, i) => { const s = S.get(r.id), b = base.get(r.id);
      return `<tr class="${r.id === fid ? "me" : ""} ${spots && i === spots - 1 ? "cut" : ""}"><td>${i + 1}</td><td class="t">${esc(teamName(D, r.id))}<div class="sub">likely ${placeTxt(rangeOf(S, r.id))}</div></td>
      <td>${r.w}-${r.d}-${r.l}</td><td>${r.gd > 0 ? "+" : ""}${r.gd}</td><td><b>${r.pts}</b></td>
      <td class="chance">${pct(s.pos[0])}${nP ? delta(s.pos[0], b.pos[0]) : ""}</td>${spots ? `<td class="chance">${pct(atOrAbove(S, r.id, spots - 1))}${nP ? delta(atOrAbove(S, r.id, spots - 1), atOrAbove(base, r.id, spots - 1)) : ""}</td>` : ""}</tr>`; }).join("")}
  </table><div class="mut" style="margin-top:6px"><b>W-D-L, GD, PTS:</b> final table if every pick comes true. <b>Shaded:</b> real chances from ${N.toLocaleString()} simulated seasons${nP ? " with your changes locked in" : ""}.</div>`;
  const c = $("#clearpicks"); if (c) c.onclick = () => { PICKS[D.__fk] = {}; document.querySelectorAll("#predgames .toggles button.on").forEach(b => b.classList.remove("on")); drawPredictor(); };
}
function onPick(e) {
  const b = e.target.closest(".toggles button"); if (!b) return;
  const wrap = b.parentElement, id = wrap.dataset.g, f = b.dataset.f, P = PICKS[CTX.D.__fk];
  if (P[id] === f || b.classList.contains("ours")) { delete P[id]; wrap.querySelectorAll("button").forEach(x => x.classList.remove("on")); }
  else { P[id] = f; wrap.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); }
  $("#predtable").style.opacity = .55; setTimeout(() => { drawPredictor(); $("#predtable").style.opacity = 1; }, 10);
}

// Events (national events, tournaments) inside the team page; brackets show the possible path.
function eventBody(D, ev, fid) {
  const M = makeModel(ev.teams, D.model), tn = id => { const t = ev.teams.find(x => x.id === id); return t ? t.short : "TBD"; };
  const Dl = {teams: ev.teams, __fk: D.__fk};
  const games = ev.games.slice().sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time) || (a.num || 0) - (b.num || 0));
  const first = games.filter(g => g.home_id && g.away_id && g.hs == null && (g.home_id === fid || g.away_id === fid));
  const done = games.filter(g => g.hs != null && g.as != null);
  let path = "", WIN = "";
  if (ev.bracket) {
    const byNum = new Map(games.map(g => [g.num, g]));
    const ref = s => { const m = /^(Winner|Loser)\s+(?:of\s+)?Game\s+#?(\d+)/i.exec(s || ""); return m ? [m[1].toLowerCase(), +m[2]] : null; };
    const N = 15000, appear = new Map(games.map(g => [g.num, new Map()])), opp = new Map(games.map(g => [g.num, new Map()]));
    const isWin = (g, seen = new Set()) => { if (!g) return false; const rh = ref(g.home), ra = ref(g.away); if (!rh && !ra) return true; if (!rh || !ra) return false; return rh[0] === "winner" && ra[0] === "winner" && isWin(byNum.get(rh[1])) && isWin(byNum.get(ra[1])); };
    const depth = g => { const r = ref(g && g.home); return r ? 1 + depth(byNum.get(r[1])) : 0; };
    const wp = games.filter(g => isWin(g) && ref(g.home)); const champ = wp.length ? wp.reduce((a, b) => depth(b) > depth(a) ? b : a) : null;
    let wins = 0; 
    for (let n = 0; n < N; n++) {
      const res = new Map();
      const side = (g, s) => { const id = g[s + "_id"]; if (id) return id; const r = ref(g[s]); if (!r) return null; const o = play(byNum.get(r[1])); return o ? (r[0] === "winner" ? o[0] : o[1]) : null; };
      const play = g => { if (!g) return null; if (res.has(g.num)) return res.get(g.num);
        const h = side(g, "home"), a = side(g, "away"); if (!h || !a) { res.set(g.num, null); return null; }
        let hw; if (g.hs != null && g.as != null) hw = g.hs > g.as || (g.hs === g.as && (g.hpk ?? 0) > (g.apk ?? 0)); else { const [x, y] = M.sample(h, a, true); hw = x > y || (x === y && Math.random() < .5); }
        const o = hw ? [h, a] : [a, h]; res.set(g.num, o);
        if (h === fid || a === fid) { const m = appear.get(g.num); const other = h === fid ? a : h; m.set(other, (m.get(other) || 0) + 1); }
        return o; };
      games.forEach(play); if (champ && res.get(champ.num) && res.get(champ.num)[0] === fid) wins++;
    }
    WIN = pct(wins / N);
    const stage = g => !ref(g.home) ? "Opening game" : g === champ ? "Championship" : isWin(g) ? "Winners' side" : "Consolation";
    path = `<details class="inner"><summary>Possible path through the bracket</summary><div class="mut" style="margin-bottom:6px">Win → winners' side, loss → consolation. Tied bracket games assumed to go to penalties (50/50).</div><div class="path">` +
      games.filter(g => appear.get(g.num).size).map(g => { const m = appear.get(g.num), tot = [...m.values()].reduce((a, b) => a + b, 0);
        return `<div class="node"><b>Game ${g.num}</b> · ${fmtDate(g.date)} ${fmtTime(g.time)} · ${stage(g)} <span class="mut">· plays here ${pct(tot / N)}</span>` +
          [...m.entries()].sort((a, b) => b[1] - a[1]).map(([o, c]) => { const P = M.probs(fid, o, true), cf = confidence(ev.teams, fid, o);
            return `<div>vs <b>${esc(tn(o))}</b> <span class="mut">(${pct(c / tot)})</span> · win ${pct(P.w)} · draw ${pct(P.d)} · lose ${pct(P.l)} <span class="pill ${cf[1]}" title="${esc(cf[2])}">${cf[0]}</span></div>`; }).join("") + `</div>`; }).join("") + `</div></details>`;
  }
  const others = games.filter(g => g.home_id && g.away_id && g.hs == null && g.home_id !== fid && g.away_id !== fid);
  const teamsTbl = `<details class="inner"><summary>Teams in the group (${ev.teams.length})</summary><div class="scroll"><table class="grid"><tr><th class="t">Team</th><th>Conf W-D-L</th><th>Rating</th><th>Rank</th><th>Games<br>new/all</th></tr>
    ${ev.teams.slice().sort((a, b) => b.strength - a.strength).map(t => `<tr class="${t.id === fid ? "me" : ""}"><td class="t">${esc(t.short)}<div class="sub">${esc(t.conf_name)}</div></td><td>${t.conf_record ? `${t.conf_record.w}-${t.conf_record.d}-${t.conf_record.l}` : "—"}</td><td>${t.strength > 0 ? "+" : ""}${t.strength.toFixed(2)}</td><td>${t.pool_rank ? "#" + t.pool_rank : "—"}</td><td>${t.games_new} / ${t.games_rated}</td></tr>`).join("")}</table></div>
    <div class="mut" style="margin-top:4px">Rating = expected goal difference vs an average team. Rank among all rated teams in this age group.</div></details>`;
  return (first.map(g => fixtureCard(Dl, M, g, {focus: fid, neutral: true, teams: ev.teams})).join(""))
    + (ev.bracket ? `<div style="margin:6px 0">Chance to win the group: <b>${WIN}</b></div>` : "") + path
    + (done.length ? `<h3>Results</h3>` + done.map(g => resultRow(Dl, g, fid)).join("") : "")
    + (others.length ? `<details class="inner"><summary>Other games in the group (${others.length})</summary>${others.map(g => fixtureCard(Dl, M, g, {neutral: true, teams: ev.teams})).join("")}</details>` : "")
    + teamsTbl;
}

function accuracy(D) {
  const bt = D.pool_stats && D.pool_stats.backtest; if (!bt) return "";
  const B = bt.buckets || {}, row = (k, label) => B[k] ? `<tr><td class="t">${label}</td><td>${B[k].games}</td><td>${Math.round(B[k].won * 100)}%</td><td>${Math.round(B[k].not_lose * 100)}%</td></tr>` : "";
  const LR = D.live_record;
  const live = LR && LR.games ? `<h3>Live record (this conference)</h3><div>Our pick was right in <b>${LR.correct} of ${LR.games}</b> games (${Math.round(LR.correct / LR.games * 100)}%).</div>`
    + LR.recent.map(e => `<div class="rrow"><span class="res res-${e.result === e.pick ? "w" : "l"}">${e.result === e.pick ? "✓" : "✗"}</span><span class="rd">${fmtDate(e.date)}</span><span class="rt">${esc(e.home)} <b>${e.score}</b> ${esc(e.away)}</span></div>`).join("")
    : `<div class="mut" style="margin-top:8px">Live record: each game's pick is saved before it's played and scored after.</div>`;
  return sec("past", "Model", "How accurate is this?", `Replayed ${bt.games.toLocaleString()} ECNL / ECNL RL games from this season, predicting each from results before it.`, `
    <table class="grid"><tr><th class="t">Favorite given…</th><th>Games</th><th>Won</th><th>Didn't lose</th></tr>${row("70+", "70% or more")}${row("60-69", "60–69%")}${row("50-59", "50–59%")}${row("<50", "under 50%")}</table>
    <div class="mut" style="margin-top:6px">Exact result right ${Math.round(bt.accuracy * 100)}% of the time; favorite didn't lose ${Math.round((bt.fav_not_lose || 0) * 100)}%. About 1 in 5 games is a draw, so ~60% is near the ceiling even for professional models.</div>${live}`, "acc", false);
}
