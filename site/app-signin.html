<!DOCTYPE html>
<!-- Sign-in for the App Store app. The app opens this page in the iPhone's own sign-in sheet
     (ASWebAuthenticationSession), which shares Safari: Google already knows you, passwords autofill,
     Sign in with Apple uses Face ID. Once signed in here, this page gets a one-time sign-in pass from
     /api/app/ticket and hands it back to the app (sideline://signin?ticket=...). -->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sign in · Sideline Standings</title>
<style>
html,body{margin:0;background:#0d1015;color:#e8eaed;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
.w{max-width:420px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 18px 40px;text-align:center}
.logo{width:56px;height:56px;border-radius:14px;margin:10px auto 12px;display:block}
h1{font-size:22px;margin:0 0 6px}p{color:#a3acb9;font-size:15px;line-height:1.45;margin:0 0 18px}
#box{display:flex;justify-content:center;min-height:120px}
.msg{color:#a3acb9;font-size:14px;margin-top:18px}
a{color:#7aa7ff}
.authbtns{display:flex;flex-direction:column;gap:10px;margin-top:14px}.authbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border-radius:12px;padding:14px;font:inherit;font-size:16px;font-weight:700;cursor:pointer;border:0}.authbtn.apple{background:#fff;color:#000}.authbtn.google{background:#1f2630;color:#e8eaed;border:1px solid #3a4452}.authbtn[disabled]{opacity:.6}.authemail{background:none;border:0;color:#a3acb9;font:inherit;font-size:14px;margin-top:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
#box{display:none}#box.on{display:flex}
</style></head>
<body><div class="w">
<img class="logo" src="icons/icon-192.png" alt="">
<h1>Sign in to Sideline Standings</h1>
<p>Free account. Keeps your teams, alerts and picks on all your devices.</p>
<div class="authbtns"><button class="authbtn apple" data-oauth="oauth_apple"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg><span>Continue with Apple</span></button><button class="authbtn google" data-oauth="oauth_google"><svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg><span>Continue with Google</span></button></div><button class="authemail" data-email="1">Use email instead</button>
<div id="already" style="display:none;margin-top:14px"><p id="alreadywho" style="margin-bottom:12px"></p>
  <div class="authbtns"><button class="authbtn apple" id="contbtn">Continue</button><button class="authbtn google" id="otherbtn">Use a different account</button></div></div>
<div id="box"></div>
<div class="msg" id="msg">Loading sign-in…</div>
<div class="msg"><a href="sideline://signin?cancel=1">Cancel</a></div>
</div>
<script>
const PK = "pk_live_Y2xlcmsuc2lkZWxpbmVzdGFuZGluZ3MuY29tJA";
const msg = t => document.getElementById("msg").textContent = t;
// each step goes to the server logs (path only, nothing personal) so sign-in problems can be traced
const slog = (what, d) => { try { fetch("/api/log/app/sheet-" + what + "/" + encodeURIComponent(String(d || "").slice(0, 80)), {method: "POST", keepalive: true}); } catch (e) {} };
let going = false;
async function handBack() {
  if (going || !window.Clerk.user) return; going = true;
  msg("Signing you in to the app…");
  try {
    const t = await window.Clerk.session.getToken();
    const r = await fetch("/api/app/ticket", {method: "POST", headers: {authorization: "Bearer " + t}, cache: "no-store"});
    const j = await r.json();
    if (!r.ok || !j.ticket) throw new Error(j.error || "no pass");
    location.href = "sideline://signin?ticket=" + encodeURIComponent(j.ticket);
  } catch (e) { going = false; msg("Couldn't finish signing in. Close this and try again."); }
}
const sc = document.createElement("script");
sc.src = "https://clerk.sidelinestandings.com/npm/@clerk/clerk-js@5/dist/clerk.browser.js";
sc.async = true; sc.crossOrigin = "anonymous"; sc.setAttribute("data-clerk-publishable-key", PK);
sc.onload = async () => {
  try {
    await window.Clerk.load({appearance: {variables: {colorPrimary: "#c8102e", colorBackground: "#151a21", colorText: "#e8eaed", colorTextSecondary: "#a3acb9", colorInputBackground: "#1b2129", colorInputText: "#e8eaed", colorNeutral: "#e8eaed", borderRadius: "10px"}}});
    // This sheet keeps its own sign-in (shared with Safari), separate from the app. Someone who signed out
    // of the app may want a different account, so an existing sign-in is offered, never used silently.
    // Coming back from Apple / Google (a method was just picked) carries straight on.
    const first = window.Clerk.user ? window.Clerk.user.id : null, picked = sessionStorage.getItem("ssPick");
    slog("load", (first ? "user" : "nouser") + (picked ? "-picked" : ""));
    sessionStorage.removeItem("ssPick");
    window.Clerk.addListener(() => { if (window.Clerk.user && window.Clerk.user.id !== first) handBack(); });
    const pick = () => sessionStorage.setItem("ssPick", "1");
    const opts = document.querySelector(".authbtns"), em = document.querySelector("[data-email]");
    if (first && picked) return handBack();
    if (first) {
      opts.style.display = "none"; em.style.display = "none";
      const u = window.Clerk.user, who = (u.primaryEmailAddress && u.primaryEmailAddress.emailAddress) || u.fullName || "your account";
      document.getElementById("alreadywho").textContent = "You're signed in as " + who + ".";
      document.getElementById("contbtn").textContent = "Continue as " + who;
      document.getElementById("already").style.display = "block";
      document.getElementById("contbtn").onclick = () => handBack();
      document.getElementById("otherbtn").onclick = async () => {
        document.getElementById("already").style.display = "none"; msg("Signing out…");
        try { await window.Clerk.signOut(); slog("signedout", window.Clerk.user ? "still-user" : "ok"); } catch (x) { slog("signout-error", x && x.message); }
        opts.style.display = ""; em.style.display = ""; msg("");   // straight to the choices, no reload
      };
      msg(""); return;
    }
    msg("");
    document.addEventListener("click", async e => {
      const o = e.target.closest("[data-oauth]");
      if (o) { o.disabled = true; pick(); try { await window.Clerk.client.signIn.authenticateWithRedirect({strategy: o.dataset.oauth, redirectUrl: location.origin + "/sso-callback.html", redirectUrlComplete: location.href}); } catch (x) { o.disabled = false; msg("Couldn't open that. Try email instead."); } }
      if (e.target.closest("[data-email]")) {
        pick();   // buttons stay behind the window, so closing it leaves the choices
        // Clerk's own sign-in window (the embedded form needs a page route of its own and showed blank here)
        slog("email", window.Clerk.user ? "user" : "nouser");
        try { window.Clerk.openSignIn({withSignUp: true, fallbackRedirectUrl: location.href, signUpFallbackRedirectUrl: location.href}); slog("opened", "ok"); }
        catch (x) { slog("open-error", x && x.message); msg("Couldn't open email sign-in. Close this and try again."); }
      }
    });
  } catch (e) { slog("load-error", e && e.message); msg("Sign-in didn't load. Close this and try again."); }
};
document.head.appendChild(sc);
</script>
</body></html>
