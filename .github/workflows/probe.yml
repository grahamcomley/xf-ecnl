name: Probe sample pages (one-time, manual)
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Space-separated URLs"
        required: true
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/probe.py ${{ github.event.inputs.urls }}
      - run: |
          git config user.name "xf-ecnl-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/probe && (git diff --cached --quiet || (git commit -m "Probe pages" && git pull --rebase && git push))
