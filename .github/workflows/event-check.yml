name: Event check (manual, report only)
on:
  workflow_dispatch:
    inputs:
      events:
        description: "AthleteOne event ids, space-separated"
        required: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - env:
          EVENTS: ${{ github.event.inputs.events }}
        run: python scripts/event_check.py $EVENTS | tee -a $GITHUB_STEP_SUMMARY
