name: Update data and publish site

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "auto (default), quick, full, or publish (pages only)"
        required: false
        default: auto
  push:
    branches: [main]
    paths: ["site/**", "api/**", "uat-overrides/**", "site-worker/**", "site-worker-uat/**", "forwarder/**", "scripts/**", "config.json", ".github/workflows/update.yml"]
  schedule:
    # Backup timer (GitHub's timer can be late). The outside timer triggers every 15 minutes.
    - cron: "23 */3 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Queued runs must start from the latest commit, not the one they were triggered on.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Raw API responses and the last built site data live in the Actions cache (not the repo):
      # restored each run, saved after. Age groups with no new games reuse their built pages.
      - uses: actions/cache@v4
        with:
          path: |
            data/cache
            site/data
          key: apicache-${{ github.run_id }}
          restore-keys: apicache-

      - name: Decide what to do
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MODE="${{ github.event.inputs.mode || 'auto' }}"
          if [ "$MODE" = publish ] && [ ! -f site/data/teams.json ]; then MODE=quick; fi
          if [ "${{ github.event_name }}" = "push" ]; then
            MODE=full
            # A push that only changes the page (site/, not site/data) just republishes the last data.
            FILES=$(gh api "repos/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.sha }}" --jq '.files[].filename' 2>/dev/null || echo "?")
            echo "changed: $FILES"
            if [ -n "$FILES" ] && ! echo "$FILES" | grep -qvE '^(site/|api/|site-worker/|site-worker-uat/|uat-overrides/)' && [ -f site/data/teams.json ]; then MODE=publish; fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Mode: $MODE"

      # A one-off ECNL outage (too many failed requests) shouldn't email anyone: put back the last good data,
      # publish that, and only fail the run once the scores are more than 2 hours old (same point the site
      # header shows "Paused").
      - name: Fetch ECNL data, rate teams, build site data
        id: fetch
        if: steps.plan.outputs.mode != 'publish'
        continue-on-error: true
        run: python scripts/update.py --${{ steps.plan.outputs.mode }}

      - name: If the fetch failed, skip this run (fail only if prod's scores are over 2 hours old)
        if: steps.fetch.outcome == 'failure'
        run: |
          t=$(curl -fsS "https://sidelinestandings.com/data/status.json?t=$(date +%s)" | jq -r '.checked // empty' || true)
          age=$(python3 -c "import sys,datetime as d; t=sys.argv[1]; print(int((d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(t.replace('Z','+00:00'))).total_seconds()//60) if t else 9999)" "$t")
          echo "Fetch failed this run; prod's scores were last updated ${age} minutes ago. Nothing is published this run."
          if [ "$age" -gt 120 ]; then echo "::error title=Scores not updating::Prod's scores have not updated for ${age} minutes (the ECNL fetch keeps failing). Check the run log."; exit 1; fi
          echo "::warning title=Skipped this update::ECNL fetch failed once; prod keeps its current data. The next run (15 min) normally fixes it."

      # What changed for alerts (new and corrected scores). The site's server sends the notifications.
      - name: Find new scores for alerts
        if: steps.plan.outputs.mode != 'publish' && steps.fetch.outcome == 'success'
        continue-on-error: true
        run: python scripts/alerts.py

      # Two copies of the page: UAT = the latest page (main branch); live = the page last promoted
      # (live branch). Both get the same fresh data.
      - name: Build the live copy and stamp both page versions
        if: steps.fetch.outcome != 'failure'
        run: |
          git fetch -q origin live:live
          rm -rf /tmp/livesrc site-live && mkdir -p /tmp/livesrc site-live
          git archive live site | tar -x -C /tmp/livesrc
          cp -r /tmp/livesrc/site/. site-live/
          rm -rf site-live/data && cp -r site/data site-live/data
          # UAT copy gets its own home-screen name and icons (amber "UAT" band) so both can sit on a phone.
          cp uat-overrides/icons/*.png site/icons/
          sed -i 's/"name": "Sideline Standings"/"name": "Sideline UAT"/; s/"short_name": "Sideline"/"short_name": "Sideline UAT"/' site/manifest.webmanifest
          sed -i 's/apple-mobile-web-app-title" content="Sideline"/apple-mobile-web-app-title" content="Sideline UAT"/; s#<title>Sideline Standings</title>#<title>Sideline UAT</title>#' site/index.html
          for d in site site-live; do echo "$(cat $d/index.html $d/sw.js $d/manifest.webmanifest | sha1sum | cut -c1-12) $(grep -o 'name="app-version" content="[^"]*"' $d/index.html | cut -d'"' -f4)" > $d/version.txt; done
          echo "UAT page $(cat site/version.txt) · live page $(cat site-live/version.txt)"
          # Live runs the server settings + API from the live branch too, so nothing new reaches the live
          # site until it's promoted. (Older live branches have no API yet: then live stays static-only.)
          rm -rf livecfg && mkdir -p livecfg
          git archive live site-worker | tar -x -C livecfg
          git archive live api 2>/dev/null | tar -x -C livecfg || true
          ln -s "$PWD/site-live" livecfg/site-live

      # Accounts store (Cloudflare KV, shared by UAT and live). Made once; its id is filled into both
      # server settings. If the token can't make it, the sites still publish, just without accounts.
      - name: Accounts store
        if: steps.fetch.outcome != 'failure'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          A=f4844cb4fa247cf50ffc158d9ee9d27d; API=https://api.cloudflare.com/client/v4/accounts/$A/storage/kv/namespaces
          ID=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" "$API?per_page=100" | jq -r '.result[]? | select(.title=="sideline-users") | .id' || true)
          if [ -z "$ID" ]; then
            ID=$(curl -fsS -X POST -H "Authorization: Bearer $CF_TOKEN" -H "content-type: application/json" -d '{"title":"sideline-users"}' "$API" | jq -r '.result.id // empty' || true)
          fi
          for f in site-worker-uat/wrangler.toml livecfg/site-worker/wrangler.toml; do
            [ -f "$f" ] || continue
            if [ -n "$ID" ]; then sed -i "s/KV_ID_PLACEHOLDER/$ID/" "$f"; else sed -i '/# KV-BEGIN/,/# KV-END/d' "$f"; fi
          done
          if [ -n "$ID" ]; then echo "Accounts store: $ID"; else echo "::warning::Couldn't find or make the accounts store (token needs Workers KV Storage: Edit). Sites publish without accounts."; fi

      - name: Save raw data back to the repo (only when it changed)
        if: (steps.plan.outputs.mode != 'publish') && steps.fetch.outcome != 'failure'
        continue-on-error: true   # never block publishing the site
        run: |
          git config user.name "xf-ecnl-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Data update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase -X theirs --autostash || { git rebase --abort; git pull --no-rebase -X ours --no-edit; }
            git push
          fi

      # Only changed files upload to Cloudflare.
      # Cloudflare sometimes returns a one-off error: each publish gets one retry 30 s later, so a failure
      # email means something real (the check at the end still fails if a site isn't serving the new page).
      - name: Publish UAT (uat.sidelinestandings.com)
        if: steps.fetch.outcome != 'failure'
        id: uat1
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4"
          workingDirectory: site-worker-uat
          command: deploy
      - name: Wait before retrying UAT
        if: (steps.uat1.outcome == 'failure') && steps.fetch.outcome != 'failure'
        run: sleep 30
      - name: Publish UAT, second try
        if: (steps.uat1.outcome == 'failure') && steps.fetch.outcome != 'failure'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4"
          workingDirectory: site-worker-uat
          command: deploy

      - name: Publish live (sidelinestandings.com)
        if: steps.fetch.outcome != 'failure'
        id: live1
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4"
          workingDirectory: livecfg/site-worker
          command: deploy
      - name: Wait before retrying live
        if: (steps.live1.outcome == 'failure') && steps.fetch.outcome != 'failure'
        run: sleep 30
      - name: Publish live, second try
        if: (steps.live1.outcome == 'failure') && steps.fetch.outcome != 'failure'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4"
          workingDirectory: livecfg/site-worker
          command: deploy

      # The old github.io address only forwards to the new one (team links keep working). It never changes,
      # so a GitHub Pages hiccup here must not fail the run.
      - uses: actions/configure-pages@v5
        if: steps.fetch.outcome != 'failure'
        continue-on-error: true

      - uses: actions/upload-pages-artifact@v3
        if: steps.fetch.outcome != 'failure'
        continue-on-error: true
        with:
          path: forwarder

      - id: deploy
        if: steps.fetch.outcome != 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      # Confirm both sites are really serving the page just built (version.txt + the v-number in the page).
      - name: Verify UAT and live are serving the new version
        if: steps.fetch.outcome != 'failure'
        run: |
          check() {  # $1 = site url, $2 = local folder
            want=$(cat $2/version.txt); num=$(grep -o 'name="app-version" content="[^"]*"' $2/index.html | cut -d'"' -f4)
            for i in $(seq 1 18); do
              got=$(curl -fsS "$1/version.txt?t=$(date +%s%N)" -H 'Cache-Control: no-cache' || true)
              page=$(curl -fsS "$1/?t=$(date +%s%N)" -H 'Cache-Control: no-cache' | grep -o 'name="app-version" content="[^"]*"' | cut -d'"' -f4 || true)
              if [ "$got" = "$want" ] && [ "$page" = "$num" ]; then echo "OK $1 is serving $num ($want)"; echo "$1 $num" >> $GITHUB_STEP_SUMMARY; return 0; fi
              sleep 5
            done
            echo "::error::$1 is serving '$page' ($got), expected $num ($want)"; return 1
          }
          ok=0
          check https://uat.sidelinestandings.com site || ok=1
          check https://sidelinestandings.com site-live || ok=1
          exit $ok
