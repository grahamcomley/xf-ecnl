name: Update data and publish site

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "auto (default), quick, or full"
        required: false
        default: auto
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", "config.json", ".github/workflows/update.yml"]
  schedule:
    # Backup timer (GitHub's timer can be late). The outside timer triggers every 15 minutes.
    - cron: "23 */3 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Queued runs must start from the latest commit, not the one they were triggered on.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Raw API responses live in the Actions cache (not the repo): restored each run, saved after.
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: apicache-${{ github.run_id }}
          restore-keys: apicache-

      - name: Fetch ECNL data, rate teams, build site data
        run: |
          MODE="${{ github.event.inputs.mode || 'auto' }}"
          if [ "${{ github.event_name }}" = "push" ]; then MODE=full; fi
          python scripts/update.py --$MODE

      - name: Save raw data back to the repo (only when it changed)
        continue-on-error: true   # never block publishing the site
        run: |
          git config user.name "xf-ecnl-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Data update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase -X theirs --autostash || { git rebase --abort; git pull --no-rebase -X ours --no-edit; }
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
