name: Update data and publish site

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "auto (default), quick, full, or publish (pages only)"
        required: false
        default: auto
  push:
    branches: [main]
    paths: ["site/**", "site-worker/**", "site-worker-uat/**", "forwarder/**", "scripts/**", "config.json", ".github/workflows/update.yml"]
  schedule:
    # Backup timer (GitHub's timer can be late). The outside timer triggers every 15 minutes.
    - cron: "23 */3 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Queued runs must start from the latest commit, not the one they were triggered on.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Raw API responses and the last built site data live in the Actions cache (not the repo):
      # restored each run, saved after. Age groups with no new games reuse their built pages.
      - uses: actions/cache@v4
        with:
          path: |
            data/cache
            site/data
          key: apicache-${{ github.run_id }}
          restore-keys: apicache-

      - name: Decide what to do
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MODE="${{ github.event.inputs.mode || 'auto' }}"
          if [ "$MODE" = publish ] && [ ! -f site/data/teams.json ]; then MODE=quick; fi
          if [ "${{ github.event_name }}" = "push" ]; then
            MODE=full
            # A push that only changes the page (site/, not site/data) just republishes the last data.
            FILES=$(gh api "repos/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.sha }}" --jq '.files[].filename' 2>/dev/null || echo "?")
            echo "changed: $FILES"
            if [ -n "$FILES" ] && ! echo "$FILES" | grep -qvE '^site/' && [ -f site/data/teams.json ]; then MODE=publish; fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Mode: $MODE"

      - name: Fetch ECNL data, rate teams, build site data
        if: steps.plan.outputs.mode != 'publish'
        run: python scripts/update.py --${{ steps.plan.outputs.mode }}

      # Two copies of the page: UAT = the latest page (main branch); live = the page last promoted
      # (live branch). Both get the same fresh data.
      - name: Build the live copy and stamp both page versions
        run: |
          git fetch -q origin live:live
          rm -rf /tmp/livesrc site-live && mkdir -p /tmp/livesrc site-live
          git archive live site | tar -x -C /tmp/livesrc
          cp -r /tmp/livesrc/site/. site-live/
          rm -rf site-live/data && cp -r site/data site-live/data
          for d in site site-live; do cat $d/index.html $d/sw.js $d/manifest.webmanifest | sha1sum | cut -c1-12 > $d/version.txt; done
          echo "UAT page $(cat site/version.txt) · live page $(cat site-live/version.txt)"

      - name: Save raw data back to the repo (only when it changed)
        if: steps.plan.outputs.mode != 'publish'
        continue-on-error: true   # never block publishing the site
        run: |
          git config user.name "xf-ecnl-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Data update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase -X theirs --autostash || { git rebase --abort; git pull --no-rebase -X ours --no-edit; }
            git push
          fi

      # Only changed files upload to Cloudflare.
      - name: Publish UAT (uat.sidelinestandings.com)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: site-worker-uat
          command: deploy

      - name: Publish live (sidelinestandings.com)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: site-worker
          command: deploy

      # The old github.io address only forwards to the new one (team links keep working).
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: forwarder

      - id: deploy
        uses: actions/deploy-pages@v4
